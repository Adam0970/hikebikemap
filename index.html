<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kompletný Geoportál Okresu Bardejov – Cyklo, Turistika, Kataster</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #0f172a;
            --accent-bike: #059669;
            --accent-hike: #2563eb;
            --accent-single: #d97706;
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-radius: 16px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 60%, #064e3b 100%);
            color: white;
            padding: 2rem 1.25rem;
            text-align: center;
        }

        header h1 {
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        header p {
            color: #94a3b8;
            max-width: 800px;
            margin: 0 auto;
        }

        .container {
            max-width: 1400px;
            margin: 1.5rem auto;
            padding: 0 1.25rem;
        }

        .map-wrapper {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 1.25rem;
            background: var(--card-bg);
            padding: 1rem;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
            border: 1px solid #e2e8f0;
        }

        #map {
            height: 75vh;
            min-height: 500px;
            width: 100%;
            border-radius: 12px;
            z-index: 1;
        }

        .map-sidebar {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .control-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 1rem;
            border-radius: 12px;
        }

        .control-box h4 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.8rem;
        }

        .filter-btn {
            width: 100%;
            padding: 0.65rem 0.85rem;
            margin-bottom: 0.4rem;
            border: 1px solid #cbd5e1;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .status-badge {
            font-size: 0.85rem;
            padding: 0.6rem 0.8rem;
            border-radius: 8px;
            background: #e2e8f0;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
        }

        .routes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.25rem;
            margin-bottom: 3rem;
            max-height: 600px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .route-card {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .route-card h3 {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
        }

        .route-card-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.8rem;
        }

        .btn-focus {
            width: 100%;
            padding: 0.5rem;
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            color: var(--primary);
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .btn-focus:hover {
            background: var(--primary);
            color: white;
        }

        @media (max-width: 992px) {
            .map-wrapper { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Geoportál Okresu Bardejov</h1>
        <p>Reálne GIS dáta reálnych trás z OpenStreetMap na cyklomapách, Mapy.cz a katastrálnom podklade</p>
    </header>

    <div class="container">

        <div class="map-wrapper">
            <div id="map"></div>
            <div class="map-sidebar">
                <div class="control-box">
                    <h4>Stav geodát</h4>
                    <div id="statusBadge" class="status-badge">
                        <i class="fa-solid fa-spinner fa-spin"></i> Načítavam reálne dáta...
                    </div>
                </div>

                <div class="control-box">
                    <h4>Filtrovať vrstvy</h4>
                    <button class="filter-btn active" onclick="filterData('all', this)">
                        <span>Všetky trasy</span> <i class="fa-solid fa-layer-group"></i>
                    </button>
                    <button class="filter-btn" onclick="filterData('bike', this)">
                        <span>Cyklotrasy</span> <i class="fa-solid fa-person-biking"></i>
                    </button>
                    <button class="filter-btn" onclick="filterData('hike', this)">
                        <span>Turistika</span> <i class="fa-solid fa-person-hiking"></i>
                    </button>
                    <button class="filter-btn" onclick="filterData('single', this)">
                        <span>Singletrack / MTB</span> <i class="fa-solid fa-mountain"></i>
                    </button>
                </div>
            </div>
        </div>

        <h2 style="margin-bottom: 1rem;"><i class="fa-solid fa-route"></i> Zoznam načítaných trás v okrese (<span id="routeCount">0</span>)</h2>
        <div class="routes-grid" id="routes-container"></div>

    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Stred okresu Bardejov
        const map = L.map('map').setView([49.29356, 21.25091], 12);

        // 1. OSM Cyklomapa (CyclOSM)
        const cykloOsmLayer = L.tileLayer('https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png', {
            maxZoom: 20,
            attribution: '&copy; OpenStreetMap & CyclOSM'
        });

        // 2. OpenStreetMap Standard
        const osmStandard = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        });

        // 3. Google Satelit
        const googleSatellite = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            attribution: '&copy; Google Maps'
        });

        // 4. Google Hybrid
        const googleHybrid = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            attribution: '&copy; Google Maps'
        });

        // 5. Mapy.cz Outdoor / Turistická
        const outdoorMapyCz = L.tileLayer('https://m{s}.mapserver.mapy.cz/turist-m/{z}-{x}-{y}', {
            subdomains: '1234',
            maxZoom: 18,
            attribution: '&copy; Mapy.cz / Seznam.cz'
        });

        // 6. Topografický / Katastrálny podklad (ArcGIS / ZBGIS style)
        const katasterLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: '&copy; ZBGIS / Esri Topo'
        });

        // Nastavenie výchozej vrstvy - Cyklomapa
        cykloOsmLayer.addTo(map);

        // Prepínač podkladov v pravom hornom rohu
        const baseMaps = {
            "🚴 OSM Cyklomapa (CyclOSM)": cykloOsmLayer,
            "🥾 Outdoor / Turistická (Mapy.cz)": outdoorMapyCz,
            "🗺️ OpenStreetMap Štandard": osmStandard,
            "🛰️ Google Satelitná": googleSatellite,
            "🏙️ Google Hybridná": googleHybrid,
            "📐 Katastrálne / Topo podklady": katasterLayer
        };

        L.control.layers(baseMaps, null, { position: 'topright' }).addTo(map);

        let loadedRoutes = [];
        let leafletLayerGroup = L.layerGroup().addTo(map);
        let activeFilter = 'all';

        // Výpočet dĺžky z reálnych súradníc
        function calculateDistance(latlngs) {
            let total = 0;
            for (let i = 0; i < latlngs.length - 1; i++) {
                total += latlngs[i].distanceTo(latlngs[i + 1]);
            }
            return (total / 1000).toFixed(2);
        }

        // NAČÍTANIE SKUTOČNÝCH TRÁS CEZ OVERPASS API (REÁLNA GEOMETRIA CHODNÍKOV A CIEST)
        async function fetchRealDistrictData() {
            const statusBadge = document.getElementById('statusBadge');
            
            // Bounding box pre Bardejov a širšie okolie
            const bbox = "49.18,21.10,49.40,21.45";

            // Overpass QL dotaz na získanie reálnych cyklotrás, turistických chodníkov a singletrackov
            const query = `
                [out:json][timeout:25];
                (
                  relation["route"="bicycle"](${bbox});
                  relation["route"="hiking"](${bbox});
                  relation["route"="foot"](${bbox});
                  way["highway"="cycleway"](${bbox});
                  way["mtb:scale"](${bbox});
                );
                out body;
                >;
                out skel qt;
            `;

            try {
                const response = await fetch("https://overpass-api.de/api/interpreter", {
                    method: "POST",
                    body: "data=" + encodeURIComponent(query)
                });

                const data = await response.json();

                // 1. Uloženie všetkých bodov (nodes)
                const nodes = {};
                data.elements.forEach(el => {
                    if (el.type === 'node') {
                        nodes[el.id] = L.latLng(el.lat, el.lon);
                    }
                });

                // 2. Spracovanie ciest (ways)
                const ways = {};
                data.elements.forEach(el => {
                    if (el.type === 'way' && el.nodes) {
                        ways[el.id] = el.nodes.map(nid => nodes[nid]).filter(n => n !== undefined);
                    }
                });

                // 3. Spracovanie relácií aj samostatných ciest do reálnych línií
                let routeIdCounter = 1;

                data.elements.forEach(el => {
                    let category = 'hike';
                    let name = el.tags?.name || el.tags?.ref || '';

                    if (el.tags?.route === 'bicycle' || el.tags?.highway === 'cycleway' || el.tags?.bicycle === 'yes') {
                        category = 'bike';
                    } else if (el.tags?.['mtb:scale'] || el.tags?.designation === 'singletrack') {
                        category = 'single';
                    }

                    if (!name) {
                        name = category === 'bike' ? `Cyklotrasa #${routeIdCounter}` : 
                              (category === 'single' ? `Singletrack #${routeIdCounter}` : `Turistický chodník #${routeIdCounter}`);
                    }

                    let lineSegments = [];

                    if (el.type === 'relation' && el.members) {
                        el.members.forEach(m => {
                            if (m.type === 'way' && ways[m.ref]) {
                                lineSegments.push(ways[m.ref]);
                            }
                        });
                    } else if (el.type === 'way' && ways[el.id]) {
                        lineSegments.push(ways[el.id]);
                    }

                    lineSegments.forEach((segment) => {
                        if (segment.length > 1) {
                            const dist = calculateDistance(segment);
                            if (parseFloat(dist) > 0.1) {
                                loadedRoutes.push({
                                    id: `r-${routeIdCounter++}`,
                                    name: name,
                                    category: category,
                                    length: `${dist} km`,
                                    latlngs: segment
                                });
                            }
                        }
                    });
                });

                statusBadge.innerHTML = `<i class="fa-solid fa-check" style="color:#059669;"></i> Načítaných ${loadedRoutes.length} reálnych úsekov`;
                renderMapAndList();

            } catch (err) {
                console.error("Chyba pri načítavaní z OpenStreetMap API:", err);
                statusBadge.innerHTML = `<i class="fa-solid fa-circle-exclamation" style="color:#dc2626;"></i> Chyba pri načítaní dát`;
            }
        }

        function getCategoryColor(cat) {
            switch(cat) {
                case 'bike': return '#059669';
                case 'hike': return '#2563eb';
                case 'single': return '#d97706';
                default: return '#0f172a';
            }
        }

        function renderMapAndList() {
            leafletLayerGroup.clearLayers();
            const container = document.getElementById('routes-container');
            container.innerHTML = '';

            let visibleCount = 0;

            loadedRoutes.forEach(route => {
                if (activeFilter === 'all' || route.category === activeFilter) {
                    visibleCount++;
                    const color = getCategoryColor(route.category);

                    // Zakreslenie PRESNEJ geometrie do mapy
                    const polyline = L.polyline(route.latlngs, {
                        color: color,
                        weight: 4,
                        opacity: 0.85
                    });

                    polyline.bindPopup(`
                        <b>${route.name}</b><br>
                        Dĺžka úseku: ${route.length}<br>
                        Kategória: ${route.category.toUpperCase()}
                    `);

                    leafletLayerGroup.addLayer(polyline);

                    // Pridanie karty do zoznamu
                    const card = document.createElement('div');
                    card.className = 'route-card';
                    card.innerHTML = `
                        <div>
                            <h3>${route.name}</h3>
                            <div class="route-card-meta">
                                <span>Typ: <b>${route.category}</b></span> | 
                                <span>Dĺžka: <b>${route.length}</b></span>
                            </div>
                        </div>
                        <button class="btn-focus" onclick="focusRoute('${route.id}')">
                            <i class="fa-solid fa-crosshairs"></i> Zobraziť na mape
                        </button>
                    `;
                    container.appendChild(card);

                    route.leafletRef = polyline;
                }
            });

            document.getElementById('routeCount').innerText = visibleCount;
        }

        function focusRoute(routeId) {
            const route = loadedRoutes.find(r => r.id === routeId);
            if (route && route.leafletRef) {
                map.fitBounds(route.leafletRef.getBounds(), { padding: [40, 40] });
                route.leafletRef.openPopup();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function filterData(filter, btn) {
            activeFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderMapAndList();
        }

        // Spustenie pri načítaní stránky
        fetchRealDistrictData();
    </script>
</body>
</html>
