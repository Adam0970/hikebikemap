<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Bardejov GIS Geoportál PRO – Cyklo, Turistika, Satelit & POI</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #0f172a;
            --primary-light: #1e293b;
            --accent-bike: #10b981;
            --accent-hike: #2563eb;
            --accent-single: #f59e0b;
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); overflow-x: hidden; }

        header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 60%, #064e3b 100%);
            color: white; padding: 1rem 2rem; box-shadow: var(--shadow-sm);
        }
        .header-container {
            max-width: 1800px; margin: 0 auto; display: flex;
            justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;
        }
        .brand-box { display: flex; align-items: center; gap: 0.8rem; }
        .brand-icon {
            width: 44px; height: 44px; background: rgba(16, 185, 129, 0.2);
            border: 1px solid var(--accent-bike); border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: var(--accent-bike); font-size: 1.4rem;
        }
        .brand-text h1 { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em; }
        .brand-text p { font-size: 0.8rem; color: #94a3b8; }

        .top-controls { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
        .stats-ticker {
            display: flex; gap: 1.2rem; background: rgba(255,255,255,0.08);
            padding: 0.4rem 1rem; border-radius: var(--radius-md); border: 1px solid rgba(255,255,255,0.12);
        }
        .stat-item { text-align: center; }
        .stat-item .val { font-weight: 800; font-size: 0.95rem; color: #38bdf8; display: block; }
        .stat-item .lbl { font-size: 0.65rem; color: #94a3b8; text-transform: uppercase; font-weight: 700; }

        .lang-switcher {
            display: flex; background: rgba(0,0,0,0.3); padding: 3px;
            border-radius: var(--radius-md); border: 1px solid rgba(255,255,255,0.15);
        }
        .lang-btn {
            background: transparent; border: none; color: #94a3b8; padding: 0.35rem 0.65rem;
            font-weight: 700; font-size: 0.78rem; border-radius: 6px; cursor: pointer; transition: all 0.2s;
        }
        .lang-btn.active { background: var(--accent-bike); color: white; }

        .app-layout {
            max-width: 1800px; margin: 1rem auto; padding: 0 1rem;
            display: grid; grid-template-columns: 430px 1fr; gap: 1.25rem;
            height: calc(100vh - 105px); min-height: 650px;
        }
        .sidebar {
            background: var(--card-bg); border-radius: var(--radius-lg);
            border: 1px solid var(--border); box-shadow: var(--shadow-sm);
            display: flex; flex-direction: column; overflow: hidden;
        }
        .sidebar-header { padding: 1.1rem; border-bottom: 1px solid var(--border); background: #f8fafc; }

        .status-badge {
            font-size: 0.8rem; padding: 0.55rem 0.75rem; border-radius: var(--radius-md);
            font-weight: 600; display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.8rem; flex-wrap: wrap;
        }
        .status-badge.loading { background: #e0f2fe; color: #0369a1; }
        .status-badge.success { background: #dcfce7; color: #15803d; }
        .status-badge.warning { background: #fef3c7; color: #b45309; }
        .status-badge.error { background: #fee2e2; color: #b91c1c; }
        .status-detail { flex-basis: 100%; font-size: 0.68rem; font-weight: 500; opacity: 0.9; word-break: break-word; }
        .status-badge button {
            margin-left: auto; border: 1px solid currentColor; background: transparent; color: inherit;
            padding: 0.2rem 0.55rem; border-radius: 6px; font-size: 0.72rem; font-weight: 700; cursor: pointer;
        }

        .search-box { position: relative; margin-bottom: 0.6rem; }
        .search-box input {
            width: 100%; padding: 0.65rem 1rem 0.65rem 2.3rem; border: 1px solid var(--border);
            border-radius: var(--radius-md); font-size: 0.85rem; outline: none; transition: border 0.2s;
        }
        .search-box input:focus { border-color: var(--primary); }
        .search-box i { position: absolute; left: 0.8rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

        .control-row { display: flex; gap: 0.5rem; margin-bottom: 0.8rem; }
        .sort-select {
            flex: 1; padding: 0.5rem 0.75rem; border: 1px solid var(--border); border-radius: 8px;
            font-size: 0.8rem; font-weight: 600; color: var(--text-main); background: white; outline: none;
        }
        .btn-export {
            border: 1px solid var(--border); background: white; border-radius: 8px; padding: 0 0.7rem;
            cursor: pointer; color: var(--text-muted); font-size: 0.85rem;
        }
        .btn-export:hover { background: var(--primary); color: white; }

        .filter-pills { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.35rem; }
        .pill-btn {
            padding: 0.5rem 0.2rem; border: 1px solid var(--border); background: white;
            border-radius: 8px; font-weight: 700; font-size: 0.73rem; color: var(--text-muted);
            cursor: pointer; text-align: center; transition: all 0.2s;
        }
        .pill-btn:hover { background: #f1f5f9; color: var(--text-main); }
        .pill-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .catalog-container { flex-grow: 1; overflow-y: auto; padding: 0.9rem; display: flex; flex-direction: column; gap: 0.75rem; }
        .catalog-container::-webkit-scrollbar { width: 6px; }
        .catalog-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        .route-card {
            background: white; border: 1px solid var(--border); border-radius: var(--radius-md);
            padding: 1rem; cursor: pointer; transition: all 0.2s ease; position: relative;
            border-left: 6px solid #cbd5e1; display: flex; flex-direction: column; gap: 0.6rem;
        }
        .route-card.type-bike { border-left-color: var(--accent-bike); }
        .route-card.type-hike { border-left-color: var(--accent-hike); }
        .route-card.type-single { border-left-color: var(--accent-single); }
        .route-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: #94a3b8; }
        .route-card.selected { background: #f0fdf4; border-color: var(--accent-bike); box-shadow: var(--shadow-md); }

        .card-header-line { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; }
        .card-title { font-weight: 800; font-size: 0.93rem; color: var(--primary); line-height: 1.35; }
        .badge-container { display: flex; gap: 0.35rem; flex-wrap: wrap; }
        .badge {
            font-size: 0.65rem; font-weight: 800; padding: 0.2rem 0.5rem; border-radius: 6px;
            text-transform: uppercase; color: white; white-space: nowrap;
        }
        .badge.bike { background: var(--accent-bike); }
        .badge.hike { background: var(--accent-hike); }
        .badge.single { background: var(--accent-single); }
        .badge-diff { background: #e2e8f0; color: #334155; }
        .badge-diff.easy { background: #dcfce7; color: #15803d; }
        .badge-diff.medium { background: #fef3c7; color: #b45309; }
        .badge-diff.hard { background: #fee2e2; color: #b91c1c; }

        .card-grid-info {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.4rem;
            background: #f8fafc; padding: 0.55rem; border-radius: 8px;
            font-size: 0.76rem; color: var(--text-muted); font-weight: 600; border: 1px solid #f1f5f9;
        }
        .card-grid-info div { display: flex; align-items: center; gap: 0.35rem; }
        .card-grid-info i { color: var(--primary); font-size: 0.85rem; }

        .card-action-bar { display: flex; justify-content: flex-end; gap: 0.4rem; }
        .btn-sat {
            background: #e0f2fe; border: 1px solid #bae6fd; padding: 0.3rem 0.65rem; border-radius: 6px;
            font-size: 0.72rem; font-weight: 700; color: #0369a1; cursor: pointer;
            display: flex; align-items: center; gap: 0.3rem;
        }
        .btn-sat:hover { background: #0369a1; color: white; }
        .btn-sat:disabled { opacity: 0.6; cursor: progress; }
        .surf-src { font-size: 0.6rem; font-weight: 800; background: #e0f2fe; color: #0369a1; padding: 1px 4px; border-radius: 4px; white-space: nowrap; }
        .surf-src.osm { background: #dcfce7; color: #15803d; }
        .btn-show-map {
            background: transparent; border: 1px solid var(--border); padding: 0.3rem 0.65rem;
            border-radius: 6px; font-size: 0.72rem; font-weight: 700; color: var(--text-muted);
            cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 0.3rem;
        }
        .route-card:hover .btn-show-map { background: var(--primary); color: white; border-color: var(--primary); }

        .map-view {
            background: var(--card-bg); border-radius: var(--radius-lg);
            border: 1px solid var(--border); box-shadow: var(--shadow-sm);
            overflow: hidden; position: relative; display: flex; flex-direction: column;
        }
        #map { width: 100%; height: 100%; z-index: 1; }

        .custom-poi-wrapper { background: transparent !important; border: none !important; }
        .poi-pin {
            width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 13px; box-shadow: 0 3px 8px rgba(0,0,0,0.35);
            border: 2px solid white; transition: transform 0.2s;
        }
        .poi-pin:hover { transform: scale(1.25); z-index: 999; }
        .poi-peak { background: #ef4444; }
        .poi-viewpoint { background: #8b5cf6; }
        .poi-spring { background: #06b6d4; }
        .poi-shelter { background: #10b981; }
        .poi-castle { background: #d97706; }
        .poi-parking { background: #2563eb; }
        .poi-repair { background: #475569; }

        .leaflet-popup-content-wrapper { border-radius: 12px; padding: 2px; box-shadow: var(--shadow-md); }
        .popup-box { padding: 8px; font-family: 'Plus Jakarta Sans', sans-serif; }
        .popup-box h4 { font-weight: 800; font-size: 0.98rem; color: var(--primary); margin-bottom: 4px; }
        .popup-info { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px; line-height: 1.4; }

        .mobile-tabs { display: none; background: white; border-top: 1px solid var(--border); }
        .mobile-tab-btn {
            flex: 1; padding: 0.8rem; border: none; background: transparent; font-weight: 700;
            font-size: 0.85rem; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.4rem;
        }
        .mobile-tab-btn.active { color: var(--primary); border-bottom: 3px solid var(--primary); }

        @media (max-width: 1024px) {
            .app-layout { grid-template-columns: 1fr; height: auto; }
            .sidebar { height: 500px; display: none; }
            .sidebar.active-view { display: flex; }
            .map-view { height: 65vh; min-height: 450px; display: none; }
            .map-view.active-view { display: flex; }
            .mobile-tabs { display: flex; position: sticky; bottom: 0; z-index: 1000; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="brand-box">
                <div class="brand-icon"><i class="fa-solid fa-map-location-dot"></i></div>
                <div class="brand-text">
                    <h1 data-i18n="app_title">Bardejov PRO Geoportál</h1>
                    <p data-i18n="app_subtitle">Kompletná sieť cyklotrás, turistiky, satelitných snímok a bodov záujmu</p>
                </div>
            </div>
            <div class="top-controls">
                <div class="stats-ticker">
                    <div class="stat-item"><span class="val" id="statCount">0</span><span class="lbl" data-i18n="stat_routes">Trás</span></div>
                    <div class="stat-item"><span class="val" id="statKm">0 km</span><span class="lbl" data-i18n="stat_distance">Spolu km</span></div>
                    <div class="stat-item"><span class="val" id="statPoi">0</span><span class="lbl" data-i18n="stat_poi">Miest (POI)</span></div>
                </div>
                <div class="lang-switcher">
                    <button class="lang-btn active" onclick="switchLanguage('sk', this)">SK</button>
                    <button class="lang-btn" onclick="switchLanguage('en', this)">EN</button>
                    <button class="lang-btn" onclick="switchLanguage('pl', this)">PL</button>
                    <button class="lang-btn" onclick="switchLanguage('de', this)">DE</button>
                </div>
            </div>
        </div>
    </header>

    <div class="app-layout">
        <aside class="sidebar active-view" id="sidebarView">
            <div class="sidebar-header">
                <div id="statusBadge" class="status-badge loading"></div>

                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" oninput="filterAndRender(false)" data-i18n-ph="search_placeholder" placeholder="Hľadať trasu, povrch, miesto...">
                </div>

                <div class="control-row">
                    <select id="sortSelect" class="sort-select" onchange="filterAndRender(false)">
                        <option value="len_desc" data-i18n="sort_len_desc">Dĺžka: najdlhšie prvé</option>
                        <option value="len_asc" data-i18n="sort_len_asc">Dĺžka: najkratšie prvé</option>
                        <option value="name_asc" data-i18n="sort_name_asc">Názov: A – Z</option>
                    </select>
                    <button class="btn-export" onclick="exportDataset()" id="btnExport" title="bardejov-data.json"><i class="fa-solid fa-download"></i></button>
                    <button class="btn-export" onclick="satAll()" id="btnSatAll"><i class="fa-solid fa-satellite"></i></button>
                </div>

                <div class="filter-pills">
                    <button class="pill-btn active" onclick="setCategory('all', this)" data-i18n="filter_all">Všetky</button>
                    <button class="pill-btn" onclick="setCategory('bike', this)" data-i18n="filter_bike">Cyklo</button>
                    <button class="pill-btn" onclick="setCategory('hike', this)" data-i18n="filter_hike">Turistika</button>
                    <button class="pill-btn" onclick="setCategory('single', this)" data-i18n="filter_single">MTB</button>
                </div>
            </div>
            <div class="catalog-container" id="catalogList"></div>
        </aside>

        <main class="map-view active-view" id="mapView">
            <div id="map"></div>
        </main>
    </div>

    <div class="mobile-tabs">
        <button class="mobile-tab-btn active" onclick="switchMobileTab('mapView', this)">
            <i class="fa-solid fa-map"></i> <span data-i18n="tab_map">Mapa</span>
        </button>
        <button class="mobile-tab-btn" onclick="switchMobileTab('sidebarView', this)">
            <i class="fa-solid fa-list"></i> <span data-i18n="tab_list">Katalóg trás</span>
        </button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

    /* ---------- IndexedDB cache (prežije zatvorenie stránky) ---------- */
    const DB_NAME = 'bardejov-gis', STORE = 'kv', CACHE_KEY = 'dataset-v3';
    function openDb() {
        return new Promise((res, rej) => {
            const r = indexedDB.open(DB_NAME, 1);
            r.onupgradeneeded = () => r.result.createObjectStore(STORE);
            r.onsuccess = () => res(r.result);
            r.onerror = () => rej(r.error);
        });
    }
    async function cacheGet() {
        try {
            const db = await openDb();
            return await new Promise(res => {
                const q = db.transaction(STORE).objectStore(STORE).get(CACHE_KEY);
                q.onsuccess = () => res(q.result || null);
                q.onerror = () => res(null);
            });
        } catch { return null; }
    }
    async function cacheSet(v) {
        try {
            const db = await openDb();
            await new Promise(res => {
                const tx = db.transaction(STORE, 'readwrite');
                tx.objectStore(STORE).put(v, CACHE_KEY);
                tx.oncomplete = res; tx.onerror = res; tx.onabort = res;
            });
        } catch { /* cache je len bonus */ }
    }

    function validDataset(d) {

    /* ---------- Overpass ----------
       Hlavný server dáva každej IP len 2 súčasné dotazy, preto: jeden dotaz naraz,
       ďalšie zrkadlo sa spustí až po chybe alebo po HEDGE_MS čakania.
       Geometria sa orezáva na oblasť (out geom(bbox)), takže dlhé trasy cez celé
       Slovensko sa nesťahujú celé. */
    const OVERPASS_ENDPOINTS = [
        "https://overpass-api.de/api/interpreter",
        "https://lz4.overpass-api.de/api/interpreter",
        "https://z.overpass-api.de/api/interpreter",
        "https://overpass.private.coffee/api/interpreter",
        "https://maps.mail.ru/osm/tools/overpass/api/interpreter"
    ];
    const BBOX = "49.15,21.10,49.40,21.40"; // juh,západ,sever,východ
    const HEDGE_MS = 8000;
    const REQUEST_TIMEOUT_MS = 60000;

    const routesQueryFor = bb => `[out:json][timeout:55];
(
  relation["route"~"^(bicycle|hiking|mtb)$"](${bb});
  way["highway"="cycleway"](${bb});
);
out geom(${bb});`;

    const poiQueryFor = bb => `[out:json][timeout:55];
(
  nwr["natural"="peak"]["name"](${bb});
  nwr["tourism"="viewpoint"](${bb});
  nwr["man_made"="tower"]["tower:type"="observation"](${bb});
  nwr["natural"="spring"](${bb});
  nwr["amenity"="drinking_water"](${bb});
  nwr["amenity"="shelter"](${bb});
  nwr["historic"~"^(castle|ruins|fort)$"](${bb});
  nwr["amenity"="parking"]["name"](${bb});
  nwr["amenity"="bicycle_repair_station"](${bb});
  nwr["shop"="bicycle"](${bb});
);
out center tags;`;

    // oblasť rozdelená na n×n dlaždíc – menšie dotazy prejdú aj cez preťažený server
    function tileBoxes(n) {
        const [s, w, nn, e] = BBOX.split(',').map(Number);
        const dLat = (nn - s) / n, dLon = (e - w) / n, out = [];
        for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
            out.push([s + i * dLat, w + j * dLon, s + (i + 1) * dLat, w + (j + 1) * dLon].map(v => v.toFixed(4)).join(','));
        }
        return out;
    }

    async function fetchOne(endpoint, query, signal) {
        const ctl = new AbortController();
        const timer = setTimeout(() => ctl.abort(), REQUEST_TIMEOUT_MS);
        signal.addEventListener('abort', () => ctl.abort());
        try {
            const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8' },
                body: 'data=' + encodeURIComponent(query),
                signal: ctl.signal
            });
            if (!res.ok) throw new Error(`${new URL(endpoint).hostname}: HTTP ${res.status}`);
            const json = await res.json();
            if (!json || !Array.isArray(json.elements)) throw new Error(`${new URL(endpoint).hostname}: bad payload`);
            // Overpass vie vrátiť 200 aj s chybou/čiastočnými dátami – tie nepoužijeme
            if (json.remark && /error|timed out|out of memory/i.test(json.remark)) throw new Error(`${new URL(endpoint).hostname}: ${json.remark}`);
            return json.elements;
        } finally { clearTimeout(timer); }
    }

    // zrkadlá po jednom (max 2 súčasne), ďalšie sa štartuje po chybe alebo po HEDGE_MS
    function raceEndpoints(query) {
        return new Promise((resolve, reject) => {
            const ctls = [];
            let idx = 0, active = 0, done = false, lastErr = null;
            const startNext = () => {
                if (done) return;
                if (idx >= OVERPASS_ENDPOINTS.length) {
                    if (active === 0) { done = true; reject(lastErr || new Error('no endpoint')); }
                    return;
                }
                const ep = OVERPASS_ENDPOINTS[idx++];
                active++;
                const ctl = new AbortController();
                ctls.push(ctl);
                const hedge = setTimeout(startNext, HEDGE_MS);
                fetchOne(ep, query, ctl.signal)
                    .then(els => {
                        if (done) return;
                        done = true; clearTimeout(hedge);
                        ctls.forEach(c => c.abort());
                        resolve(els);
                    })
                    .catch(e => {
                        clearTimeout(hedge);
                        active--;
                        if (done) return;
                        lastErr = e; lastError = e.message;
                        console.warn('Overpass zlyhal:', e.message);
                        if (e.message.includes('429')) setTimeout(startNext, 3000); else startNext();
                    });
            };
            startNext();
        });
    }

    async function overpass(query, rounds = 2) {
        let err;
        for (let round = 0; round < rounds; round++) {
            try { return await raceEndpoints(query); }
            catch (e) { err = e; await sleep(3000 * (round + 1)); }
        }
        throw err;
    }

    /* ---------- Spracovanie OSM elementov na čisté dáta ---------- */
    const r5 = n => Math.round(n * 1e5) / 1e5;

    // out geom(bbox) vracia body mimo oblasti ako null -> reže sa na samostatné úseky
    function geomSegments(geometry) {
        const segs = [];
        let cur = [];
        for (const p of geometry) {
            if (p && p.lat != null && p.lon != null) cur.push([r5(p.lat), r5(p.lon)]);
            else { if (cur.length > 1) segs.push(cur); cur = []; }
        }
        if (cur.length > 1) segs.push(cur);
        return segs;
    }
    function segLengthM(points) {
        let m = 0;
        for (let i = 0; i < points.length - 1; i++) m += map.distance(points[i], points[i + 1]);
        return m;
    }
    function difficultyFor(km) { return km > 12 ? 'hard' : km > 6 ? 'medium' : 'easy'; }

    function parseRoutes(elements) {
        // 1. fáza: zlúčiť úseky toho istého prvku (môže prísť z viacerých dlaždíc)
        const acc = new Map();
        for (const el of elements) {
            const tags = el.tags || {};
            let cat, coords, id;
            if (el.type === 'relation' && tags.route && Array.isArray(el.members)) {
                cat = tags.route === 'bicycle' ? 'bike' : tags.route === 'mtb' ? 'single' : 'hike';
                coords = [];
                for (const m of el.members) {
                    if (m.type === 'way' && Array.isArray(m.geometry)) coords.push(...geomSegments(m.geometry));
                }
                id = `rel-${el.id}`;
            } else if (el.type === 'way' && tags.highway === 'cycleway' && Array.isArray(el.geometry)) {
                cat = 'bike'; coords = geomSegments(el.geometry); id = `way-${el.id}`;
            } else continue;
            if (!coords.length) continue;
            const ex = acc.get(id);
            if (ex) ex.coords.push(...coords); else acc.set(id, { id, cat, tags, coords });
        }
        // 2. fáza: dĺžky, filtre, duplicity
        const out = [], seenKey = new Set();
        for (const r of acc.values()) {
            const tags = r.tags;
            const km = r.coords.reduce((sum, c) => sum + segLengthM(c), 0) / 1000;
            const name = tags.name || '', ref = tags.ref || '';
            const ft = tags.from && tags.to ? `${tags.from} – ${tags.to}` : '';
            if (r.id.startsWith('rel-')) {
                if (km < 0.5) continue;
                const label = name || ref || ft;
                if (label) {
                    const key = `${r.cat}|${label}|${km.toFixed(1)}`;
                    if (seenKey.has(key)) continue; seenKey.add(key);
                }
            } else if (km < (name ? 0.3 : 0.8)) continue;
            out.push({
                id: r.id, category: r.cat, lengthKm: km.toFixed(1),
                difficulty: r.cat === 'bike' && r.id.startsWith('way-') ? 'easy' : difficultyFor(km),
                name, ref, ft, surface: tags.surface || '', coords: r.coords
            });
        }
        return out;
    }

    function poiTypeOf(tags) {
        if (tags.natural === 'peak') return 'peaks';
        if (tags.tourism === 'viewpoint' || tags.man_made === 'tower') return 'viewpoints';
        if (tags.natural === 'spring' || tags.amenity === 'drinking_water') return 'springs';
        if (tags.amenity === 'shelter') return 'shelters';
        if (tags.historic) return 'castles';
        if (tags.amenity === 'parking') return 'parking';
        if (tags.amenity === 'bicycle_repair_station' || tags.shop === 'bicycle') return 'repair';
        return null;
    }

    function parsePois(elements) {
        const out = [];
        const seen = new Set();
        for (const el of elements) {
            const tags = el.tags || {};
            const lat = el.lat != null ? el.lat : (el.center ? el.center.lat : null);
            const lon = el.lon != null ? el.lon : (el.center ? el.center.lon : null);
            if (lat == null || lon == null) continue;
            const type = poiTypeOf(tags);
            if (!type) continue;
            const id = `${el.type}-${el.id}`;
            if (seen.has(id)) continue; seen.add(id);
            out.push({ id, type, lat: r5(lat), lon: r5(lon), name: tags.name || '', ele: tags.ele || '' });
        }
        return out;
    }

    // Celá oblasť naraz; ak zlyhá, 4 menšie dlaždice. complete=false => niečo chýba, skúsi sa znova.
    async function fetchTiled(queryFor, parse, label) {
        let els, complete = true;
        try {
            els = await overpass(queryFor(BBOX), 1);
        } catch (e) {
            lastError = e.message;
            els = []; let ok = 0;
            const boxes = tileBoxes(2);
            for (const bb of boxes) {
                try { els = els.concat(await overpass(queryFor(bb), 1)); ok++; }
                catch (err) { lastError = err.message; }
            }
            if (!ok) throw new Error(lastError || `${label}: všetky dlaždice zlyhali`);
            complete = ok === boxes.length;
        }
        const items = parse(els);
        if (!items.length) throw new Error(`${label}: server vrátil 0 položiek`);
        return { items, complete };
    }

    /* ---------- Núdzový režim: len pomenované miesta cez Nominatim ----------
       Súradnice nie sú pevne zadané – berú sa zo skutočnej databázy, takže
       sú vždy na reálnej polohe. Trasy sa NEvymýšľajú. */
    const LANDMARK_QUERIES = [
        { type: 'castles', q: 'Radničné námestie Bardejov' },
        { type: 'castles', q: 'Bazilika svätého Egídia Bardejov' },
        { type: 'castles', q: 'Zborovský hrad' },
        { type: 'castles', q: 'Drevený artikulárny kostol Hervartov' },
        { type: 'springs', q: 'Bardejovské Kúpele prameň' },
        { type: 'viewpoints', q: 'Rozhľadňa Bardejov' }
    ];
    async function loadLandmarksFallback() {
        const pois = [];
        const vb = '21.10,49.40,21.40,49.15'; // západ,sever,východ,juh
        for (const lm of LANDMARK_QUERIES) {
            try {
                const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&bounded=1&viewbox=${vb}&accept-language=sk&q=${encodeURIComponent(lm.q)}`;
                const res = await fetch(url);
                if (res.ok) {
                    const arr = await res.json();
                    if (arr[0]) {
                        pois.push({
                            id: 'nom-' + arr[0].place_id, type: lm.type,
                            lat: r5(+arr[0].lat), lon: r5(+arr[0].lon),
                            name: (arr[0].name || arr[0].display_name.split(',')[0]), ele: ''
                        });
                    }
                }
            } catch { /* pokračuj ďalej */ }
            await sleep(1100); // pravidlo Nominatimu: max 1 požiadavka/s
        }
        return pois;
    }

    /* =====================================================================
       POVRCH CIEST
       1) údaj z OSM (tag surface), ak existuje a je rozpoznaný
       2) inak odhad zo satelitnej snímky (Esri World Imagery) – hrubá heuristika
    ===================================================================== */
    const OSM_SURFACE = {
        asphalt: 'asphalt', concrete: 'concrete', 'concrete:plates': 'concrete', 'concrete:lanes': 'concrete',
        paving_stones: 'paving', sett: 'cobble', cobblestone: 'cobble', unhewn_cobblestone: 'cobble',
        paved: 'paved', compacted: 'compacted', fine_gravel: 'compacted', gravel: 'gravel', pebblestone: 'gravel',
        unpaved: 'unpaved', dirt: 'dirt', earth: 'dirt', ground: 'dirt', mud: 'dirt',
        grass: 'grass', sand: 'sand', wood: 'wood', woodchips: 'wood'
    };
    function osmSurfaceClass(raw) {
        if (!raw) return null;
        const v = String(raw).split(';')[0].trim().toLowerCase();
        return OSM_SURFACE[v] || null;
    }

    let satResults = {};              // id trasy -> { cls, conf, share, coverage, n }
    const satBusy = new Set();
    const polyById = new Map();

    function surfaceInfo(route) {
        const osm = osmSurfaceClass(route.surface);
        if (osm) return { cls: osm, src: 'osm', text: t('surf_' + osm) };
        const s = satResults[route.id];
        if (s) {
            const exact = ['asphalt', 'gravel', 'dirt'].includes(s.cls);
            return { cls: s.cls, src: 'sat', conf: s.conf, text: (exact ? '≈ ' : '') + t('surf_' + s.cls) };
        }
        return { cls: null, src: null, text: t('surf_unknown') };
    }
    function surfaceCellHtml(info) {
        let badge = '';
        if (info.src === 'sat') badge = ` <small class="surf-src" title="${esc(t(info.conf === 'mid' ? 'surf_conf_mid' : 'surf_conf_low'))}">🛰️ ${t('surf_est')}</small>`;
        else if (info.src === 'osm') badge = ' <small class="surf-src osm">OSM</small>';
        return `<i class="fa-solid fa-road"></i> ${esc(info.text)}${badge}`;
    }

    function displayName(r) {
        if (r.name) return r.name;
        if (r.ref) return `${t('type_' + r.category)} ${r.ref}`;
        if (r.ft) return r.ft;
        return `${t('type_' + r.category)} #${String(r.id).replace(/\D/g, '')}`;
    }

    function popupHtml(route) {
        const info = surfaceInfo(route);
        const src = info.src === 'sat' ? ` (${t('surf_src_sat')}, ${t('surf_est')} – ${t(info.conf === 'mid' ? 'surf_conf_mid' : 'surf_conf_low')})`
                  : info.src === 'osm' ? ' (OSM)' : '';
        return `
            <div class="popup-box">
                <h4>${esc(displayName(route))}</h4>
                <div class="popup-info">
                    <b>${t('popup_length')}:</b> ${route.lengthKm} km<br>
                    <b>${t('popup_diff')}:</b> ${t('diff_' + route.difficulty)}<br>
                    <b>${t('popup_surface')}:</b> ${esc(info.text)}${esc(src)}<br>
                    <b>${t('popup_type')}:</b> ${t('type_' + route.category)}
                </div>
            </div>`;
    }

        if (filtered.length === 0) {

        }

    /* ---------- Satelitná analýza ---------- */
    const SAT_TILE = (z, x, y) => `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`;
    const SAT_KEY = 'sat-v1';
    const tileCache = new Map();
    let tileInflight = 0;
    const tileWaiters = [];
    const TILE_CONCURRENCY = 6;
    let satFailStreak = 0;

    function acquireSlot() {
        return new Promise(res => { if (tileInflight < TILE_CONCURRENCY) { tileInflight++; res(); } else tileWaiters.push(res); });
    }
    function releaseSlot() {
        const w = tileWaiters.shift();
        if (w) w(); else tileInflight--;
    }

    // vráti RGBA pixely dlaždice 256×256 alebo null (chyba / CORS / "map data not available")
    function loadTile(z, x, y) {
        const key = `${z}/${x}/${y}`;
        if (tileCache.has(key)) return tileCache.get(key);
        const p = (async () => {
            await acquireSlot();
            try {
                const img = await new Promise((res, rej) => {
                    const im = new Image();
                    im.crossOrigin = 'anonymous';
                    im.onload = () => res(im);
                    im.onerror = () => rej(new Error('tile load'));
                    im.src = SAT_TILE(z, x, y);
                });
                const c = document.createElement('canvas');
                c.width = c.height = 256;
                const ctx = c.getContext('2d', { willReadFrequently: true });
                ctx.drawImage(img, 0, 0);
                const data = ctx.getImageData(0, 0, 256, 256).data; // vyhodí chybu, ak je canvas "tainted"
                // placeholder "Map data not yet available" je takmer jednofarebný
                let sum = 0, sum2 = 0, cnt = 0;
                for (let i = 0; i < data.length; i += 4 * 97) { const l = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114; sum += l; sum2 += l * l; cnt++; }
                const sd = Math.sqrt(Math.max(0, sum2 / cnt - (sum / cnt) ** 2));
                return sd < 6 ? null : data;
            } catch (e) { return null; }
            finally { releaseSlot(); }
        })();
        tileCache.set(key, p);
        p.then(v => { if (!v) tileCache.delete(key); });
        if (tileCache.size > 220) tileCache.delete(tileCache.keys().next().value);
        return p;
    }
    let tileLoader = loadTile;

    function latLonToPx(lat, lon, z) {
        const n = 256 * Math.pow(2, z);
        const sn = Math.sin(lat * Math.PI / 180);
        return [(lon + 180) / 360 * n, (0.5 - Math.log((1 + sn) / (1 - sn)) / (4 * Math.PI)) * n];
    }

    // body rovnomerne rozložené pozdĺž trasy
    function samplePoints(route, maxSamples) {
        const total = route.coords.reduce((s, c) => s + segLengthM(c), 0);
        const step = Math.max(60, total / maxSamples);
        const pts = [];
        let nextAt = step / 2, walked = 0;
        for (const seg of route.coords) {
            for (let i = 0; i < seg.length - 1; i++) {
                const a = seg[i], b = seg[i + 1], d = map.distance(a, b);
                if (d === 0) continue;
                while (walked + d >= nextAt && pts.length < maxSamples + 2) {
                    const f = (nextAt - walked) / d;
                    pts.push([a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f]);
                    nextAt += step;
                }
                walked += d;
            }
        }
        return pts;
    }

    // jeden pixel -> trieda
    function classifyPixel(r, g, b) {
        const max = Math.max(r, g, b), min = Math.min(r, g, b);
        const sat = max ? (max - min) / max : 0;
        const lum = 0.299 * r + 0.587 * g + 0.114 * b;
        if (lum < 45) return 'shade';
        if (g > r * 1.04 && g > b * 1.12 && sat > 0.12) return 'veg';
        if (sat > 0.5) return 'other';                       // strechy, plachty, ...
        if (sat < 0.14) return lum >= 175 ? 'light' : lum >= 70 ? 'asphalt' : 'shade';
        if (r >= g && g >= b) return lum >= 150 ? 'light' : 'dirt';
        return 'veg';
    }

    // okno okolo bodu -> 'asphalt' | 'light' | 'dirt' | 'covered'
    function classifyWindow(data, ox, oy, half) {
        const c = { asphalt: 0, light: 0, dirt: 0, rest: 0 };
        let n = 0;
        for (let dy = -half; dy <= half; dy++) {
            for (let dx = -half; dx <= half; dx++) {
                const x = Math.min(255, Math.max(0, Math.round(ox) + dx));
                const y = Math.min(255, Math.max(0, Math.round(oy) + dy));
                const i = (y * 256 + x) * 4;
                const k = classifyPixel(data[i], data[i + 1], data[i + 2]);
                if (k === 'asphalt' || k === 'light' || k === 'dirt') c[k]++; else c.rest++;
                n++;
            }
        }
        const road = c.asphalt + c.light + c.dirt;
        if (road / n < 0.15) return 'covered';               // takmer všetko je vegetácia / tieň
        return ['asphalt', 'light', 'dirt'].reduce((a, b) => c[b] > c[a] ? b : a, 'asphalt');
    }

    async function analyzeRouteSurface(route) {
        const km = parseFloat(route.lengthKm);
        const z = km > 5 ? 17 : 18;
        const half = z === 18 ? 6 : 4;
        const pts = samplePoints(route, 28);
        if (pts.length < 3) return null;

        const px = pts.map(([lat, lon]) => latLonToPx(lat, lon, z));
        const keys = new Map();
        px.forEach(([x, y]) => { const tx = Math.floor(x / 256), ty = Math.floor(y / 256); keys.set(`${tx}/${ty}`, [tx, ty]); });
        const tiles = new Map();
        await Promise.all([...keys].map(async ([k, [tx, ty]]) => tiles.set(k, await tileLoader(z, tx, ty))));

        const counts = { asphalt: 0, light: 0, dirt: 0, covered: 0 };
        let ok = 0;
        px.forEach(([x, y]) => {
            const tx = Math.floor(x / 256), ty = Math.floor(y / 256);
            const data = tiles.get(`${tx}/${ty}`);
            if (!data) return;
            counts[classifyWindow(data, x - tx * 256, y - ty * 256, half)]++;
            ok++;
        });
        if (ok < Math.max(3, pts.length * 0.5)) return null;     // snímky sa nepodarilo načítať

        const visible = counts.asphalt + counts.light + counts.dirt;
        const coverage = visible / ok;
        let cls, share = 0;
        if (coverage < 0.35) cls = 'covered';
        else {
            const top = ['asphalt', 'light', 'dirt'].reduce((a, b) => counts[b] > counts[a] ? b : a, 'asphalt');
            share = counts[top] / visible;
            cls = share < 0.5 ? 'mixed' : top === 'light' ? 'gravel' : top;
        }
        const conf = (coverage >= 0.6 && share >= 0.7) ? 'mid' : 'low';
        return { cls, conf, share: +share.toFixed(2), coverage: +coverage.toFixed(2), n: ok, z };
    }

    /* uloženie výsledkov (IndexedDB) */
    async function kvGet(key) {
        try {
            const db = await openDb();
            return await new Promise(res => {
                const q = db.transaction(STORE).objectStore(STORE).get(key);
                q.onsuccess = () => res(q.result || null); q.onerror = () => res(null);
            });
        } catch { return null; }
    }
    async function kvSet(key, val) {
        try {
            const db = await openDb();
            await new Promise(res => {
                const tx = db.transaction(STORE, 'readwrite');
                tx.objectStore(STORE).put(val, key);
                tx.oncomplete = res; tx.onerror = res; tx.onabort = res;
            });
        } catch { /* len bonus */ }
    }
    let satSaveTimer = null;
    function scheduleSatSave() { clearTimeout(satSaveTimer); satSaveTimer = setTimeout(() => kvSet(SAT_KEY, satResults), 1500); }

    function updateRouteSurfaceUI(route) {
        const info = surfaceInfo(route);
        const card = document.getElementById(`card-${route.id}`);
        if (card) {
            const cell = card.querySelector('.surf-cell');
            if (cell) cell.innerHTML = surfaceCellHtml(info);
            const btn = card.querySelector('.btn-sat');
            if (btn) {
                if (info.src) btn.remove();
                else { btn.disabled = false; btn.innerHTML = `<i class="fa-solid fa-satellite"></i> ${t('btn_sat')}`; btn.title = t('sat_failed'); }
            }
        }
        const pl = polyById.get(route.id);
        if (pl) pl.setPopupContent(popupHtml(route));
    }

    async function ensureSurface(route) {
        if (osmSurfaceClass(route.surface) || satResults[route.id] || satBusy.has(route.id)) return;
        satBusy.add(route.id);
        const btn = document.querySelector(`#card-${route.id} .btn-sat`);
        if (btn) { btn.disabled = true; btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> …`; }
        try {
            const r = await analyzeRouteSurface(route);
            if (r) { satResults[route.id] = r; satFailStreak = 0; scheduleSatSave(); }
            else { satFailStreak++; console.warn('Satelitná analýza zlyhala pre', route.id); }
        } catch (e) { satFailStreak++; console.warn(e); }
        finally { satBusy.delete(route.id); updateRouteSurfaceUI(route); }
    }

    function satOne(id) {
        const r = dataset.routes.find(x => x.id === id);
        if (r) ensureSurface(r);
    }

    let batchRunning = false, batchCancel = false;
    async function satAll() {
        const btn = document.getElementById('btnSatAll');
        if (batchRunning) { batchCancel = true; return; }
        const todo = dataset.routes.filter(r => !osmSurfaceClass(r.surface) && !satResults[r.id]);
        if (!todo.length) return;
        if (!confirm(t('sat_confirm'))) return;
        batchRunning = true; batchCancel = false; satFailStreak = 0;
        let done = 0;
        const queue = [...todo];
        const worker = async () => {
            while (queue.length && !batchCancel) {
                if (satFailStreak >= 4) { batchCancel = true; alert(t('sat_failed')); break; }
                await ensureSurface(queue.shift());
                btn.innerHTML = `<i class="fa-solid fa-circle-stop"></i> ${++done}/${todo.length}`;
            }
        };
        await Promise.all([worker(), worker()]);
        batchRunning = false;
        btn.innerHTML = '<i class="fa-solid fa-satellite"></i>';
        kvSet(SAT_KEY, satResults);
        filterAndRender(false);
    }

    function highlightSingleRoute(selectedId, activePolyline) {
        const rt = dataset.routes.find(r => r.id === selectedId);
        if (rt) ensureSurface(rt);
        polylineLayerGroup.eachLayer(l => l.setStyle({ color: l.normalColor, weight: 4.5, opacity: 0.85 }));
        activePolyline.setStyle({ color: '#dc2626', weight: 9, opacity: 1.0 });
        activePolyline.bringToFront();
        document.querySelectorAll('.route-card').forEach(c => c.classList.remove('selected'));
        const card = document.getElementById(`card-${selectedId}`);
        if (card) { card.classList.add('selected'); card.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
    }

    function setCategory(cat, btn) {
        activeCategory = cat;
        document.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filterAndRender(true);
    }

    /* ---------- Stav ---------- */
    let lastStatus = 'loading';
    let lastError = '';
    let attemptNo = 0;
    function updateStatus(type) {
        lastStatus = type;
        const b = document.getElementById('statusBadge');
        const vars = { routes: dataset.routes.length, poi: dataset.pois.length };
        const retryBtn = `<button onclick="retryNow()">${t('btn_retry')}</button>`;
        const map_ = {
            loading:    ['loading', 'fa-spinner fa-spin', t('status_loading'), ''],
            refreshing: ['loading', 'fa-rotate fa-spin', t('status_refreshing'), ''],
            partial:    ['loading', 'fa-rotate fa-spin', t('status_partial', vars), ''],
            success:    ['success', 'fa-circle-check', t('status_success', vars), ''],
            cache:      ['warning', 'fa-database', t('status_cache', vars), retryBtn],
            landmarks:  ['warning', 'fa-triangle-exclamation', t('status_landmarks'), retryBtn],
            error:      ['error', 'fa-circle-exclamation', t('status_error'), retryBtn]
        };
        const [cls, icon, text, extra] = map_[type] || map_.loading;
        b.className = `status-badge ${cls}`;
        b.title = lastError || '';
        const detail = (type !== 'success' && lastError)
            ? `<div class="status-detail">⚠ ${esc(lastError)}${attemptNo ? ' · #' + attemptNo : ''}</div>` : '';
        b.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${text}</span> ${extra}${detail}`;
    }

    function switchMobileTab(viewId, btn) {
        document.querySelectorAll('.mobile-tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('sidebarView').classList.remove('active-view');
        document.getElementById('mapView').classList.remove('active-view');
        document.getElementById(viewId).classList.add('active-view');
        if (viewId === 'mapView') map.invalidateSize();
    }

    /* ---------- Export dát (pre statický záložný súbor) ---------- */
    function exportDataset() {
        if (!validDataset(dataset) || landmarkMode) return;
        const blob = new Blob([JSON.stringify({ ts: dataset.ts, routes: dataset.routes, pois: dataset.pois })], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'bardejov-data.json';
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    }

    /* =====================================================================
       RIADENIE NAČÍTANIA
       1) uložené dáta (IndexedDB) a statický súbor bardejov-data.json -> okamžite, novšie vyhráva
       2) živé dáta z OSM sa skúšajú donekonečna (max. 1 pokus/min), kým nepríde všetko
          - najprv trasy (hneď sa vykreslia), potom miesta
          - celá oblasť naraz, pri zlyhaní 4 menšie dlaždice
       3) ak nič nejde: vrstva trás Waymarked Trails + hlavné miesta
    ===================================================================== */
    let realPois = [];
    let routesFresh = false, routesComplete = false, poisFresh = false, poisComplete = false, landmarksStarted = false;

    function applyDataset(ds, fit) {
        dataset = { ts: ds.ts || Date.now(), routes: ds.routes || [], pois: ds.pois || [] };
        realPois = dataset.pois;
        hasData = dataset.routes.length > 0;
        landmarkMode = false;
        renderPois();
        filterAndRender(fit);
    }

    function persist() {
        if (dataset.routes.length) cacheSet({ ts: dataset.ts, routes: dataset.routes, pois: realPois });
    }

    // akceptuje hotový formát {routes,pois} aj surový formát zo skriptu fetch-data.mjs {routesRaw,poisRaw}
    function datasetFromAny(ds) {
        if (!ds) return null;
        if (Array.isArray(ds.routes) && ds.routes.length) return { ts: ds.ts || 0, routes: ds.routes, pois: ds.pois || [] };
        if (Array.isArray(ds.routesRaw)) {
            const routes = parseRoutes(ds.routesRaw);
            if (routes.length) return { ts: ds.ts || 1, routes, pois: parsePois(ds.poisRaw || []) };
        }
        return null;
    }

    let refreshRunning = false;
    async function refreshLive() {
        if (refreshRunning) return;
        refreshRunning = true;
        try {
            for (let attempt = 1; ; attempt++) {
                attemptNo = attempt;
                if (!routesFresh || !routesComplete) {
                    try {
                        const { items, complete } = await fetchTiled(routesQueryFor, parseRoutes, 'trasy');
                        const first = !hasData || landmarkMode;
                        dataset.routes = items; dataset.ts = Date.now();
                        hasData = true; landmarkMode = false; routesFresh = true; routesComplete = complete;
                        if (autoOverlay) setFallbackOverlays(false);
                        filterAndRender(first);
                        persist();
                    } catch (e) { lastError = e.message; console.warn('Trasy zlyhali:', e); }
                }
                if (!poisFresh || !poisComplete) {
                    try {
                        const { items, complete } = await fetchTiled(poiQueryFor, parsePois, 'miesta');
                        realPois = items; dataset.pois = items; landmarkMode = false;
                        poisFresh = true; poisComplete = complete;
                        renderPois();
                        persist();
                    } catch (e) { lastError = e.message; console.warn('Miesta zlyhali:', e); }
                }

                if (routesFresh && routesComplete && poisFresh && poisComplete) {
                    lastError = ''; updateStatus('success'); return;
                }

                // nič sa nepodarilo načítať -> aspoň záložná vrstva trás a hlavné miesta
                if (!hasData && !landmarksStarted) {
                    landmarksStarted = true;
                    setFallbackOverlays(true);
                    loadLandmarksFallback().then(pois => {
                        if (!hasData && !poisFresh && pois.length) {
                            landmarkMode = true;
                            dataset = { ts: 0, routes: [], pois };
                            renderPois();
                            filterAndRender(false);
                            map.fitBounds(L.latLngBounds(pois.map(p => [p.lat, p.lon])), { padding: [40, 40] });
                            updateStatus('landmarks');
                        }
                    });
                }
                updateStatus(routesFresh ? 'partial' : (hasData ? 'cache' : 'landmarks'));
                await sleep(Math.min(60000, 5000 * attempt));
            }
        } finally { refreshRunning = false; }
    }

    function retryNow() {
        updateStatus(hasData ? 'refreshing' : 'loading');
        refreshLive();
    }

    window.addEventListener('online', () => { if (!refreshRunning) retryNow(); });

    async function init() {
        updateStatus('loading');

        satResults = (await kvGet(SAT_KEY)) || {};

        const [cached, stat] = await Promise.all([
            cacheGet().then(datasetFromAny),
            fetch('bardejov-data.json', { cache: 'no-cache' })
                .then(r => r.ok ? r.json() : null).catch(() => null).then(datasetFromAny)
        ]);
        const best = [cached, stat].filter(Boolean).sort((a, b) => (b.ts || 0) - (a.ts || 0))[0];
        if (best) { applyDataset(best, true); updateStatus('refreshing'); }

        refreshLive();
    }

    init();
    </script>
</body>
</html>
