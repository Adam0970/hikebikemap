<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Bardejov GIS Geoportál PRO – Cyklo, Turistika, Satelit & POI</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #0f172a;
            --primary-light: #1e293b;
            --accent-bike: #10b981;
            --accent-hike: #2563eb;
            --accent-single: #f59e0b;
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); overflow-x: hidden; }

        /* HEADER */
        header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 60%, #064e3b 100%);
            color: white; padding: 1rem 2rem; box-shadow: var(--shadow-sm);
        }

        .header-container {
            max-width: 1800px; margin: 0 auto; display: flex;
            justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;
        }

        .brand-box { display: flex; align-items: center; gap: 0.8rem; }
        .brand-icon {
            width: 44px; height: 44px; background: rgba(16, 185, 129, 0.2);
            border: 1px solid var(--accent-bike); border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: var(--accent-bike); font-size: 1.4rem;
        }

        .brand-text h1 { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em; }
        .brand-text p { font-size: 0.8rem; color: #94a3b8; }

        .top-controls { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }

        .stats-ticker {
            display: flex; gap: 1.2rem; background: rgba(255,255,255,0.08);
            padding: 0.4rem 1rem; border-radius: var(--radius-md); border: 1px solid rgba(255,255,255,0.12);
        }

        .stat-item { text-align: center; }
        .stat-item .val { font-weight: 800; font-size: 0.95rem; color: #38bdf8; display: block; }
        .stat-item .lbl { font-size: 0.65rem; color: #94a3b8; text-transform: uppercase; font-weight: 700; }

        .lang-switcher {
            display: flex; background: rgba(0,0,0,0.3); padding: 3px;
            border-radius: var(--radius-md); border: 1px solid rgba(255,255,255,0.15);
        }

        .lang-btn {
            background: transparent; border: none; color: #94a3b8; padding: 0.35rem 0.65rem;
            font-weight: 700; font-size: 0.78rem; border-radius: 6px; cursor: pointer; transition: all 0.2s;
        }
        .lang-btn.active { background: var(--accent-bike); color: white; }

        /* MAIN APP LAYOUT */
        .app-layout {
            max-width: 1800px; margin: 1rem auto; padding: 0 1rem;
            display: grid; grid-template-columns: 430px 1fr; gap: 1.25rem;
            height: calc(100vh - 105px); min-height: 650px;
        }

        /* SIDEBAR KATALÓG TRÁS */
        .sidebar {
            background: var(--card-bg); border-radius: var(--radius-lg);
            border: 1px solid var(--border); box-shadow: var(--shadow-sm);
            display: flex; flex-direction: column; overflow: hidden;
        }

        .sidebar-header { padding: 1.1rem; border-bottom: 1px solid var(--border); background: #f8fafc; }

        .status-badge {
            font-size: 0.8rem; padding: 0.55rem 0.75rem; border-radius: var(--radius-md);
            font-weight: 600; display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.8rem;
        }
        .status-badge.loading { background: #e0f2fe; color: #0369a1; }
        .status-badge.success { background: #dcfce7; color: #15803d; }
        .status-badge.error { background: #fee2e2; color: #b91c1c; }

        .search-box { position: relative; margin-bottom: 0.6rem; }
        .search-box input {
            width: 100%; padding: 0.65rem 1rem 0.65rem 2.3rem; border: 1px solid var(--border);
            border-radius: var(--radius-md); font-size: 0.85rem; outline: none; transition: border 0.2s;
        }
        .search-box input:focus { border-color: var(--primary); }
        .search-box i { position: absolute; left: 0.8rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

        .control-row { display: flex; gap: 0.5rem; margin-bottom: 0.8rem; }
        
        .sort-select {
            width: 100%; padding: 0.5rem 0.75rem; border: 1px solid var(--border); border-radius: 8px;
            font-size: 0.8rem; font-weight: 600; color: var(--text-main); background: white; outline: none;
        }

        .filter-pills { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.35rem; }
        .pill-btn {
            padding: 0.5rem 0.2rem; border: 1px solid var(--border); background: white;
            border-radius: 8px; font-weight: 700; font-size: 0.73rem; color: var(--text-muted);
            cursor: pointer; text-align: center; transition: all 0.2s;
        }
        .pill-btn:hover { background: #f1f5f9; color: var(--text-main); }
        .pill-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* PREHĽADNÝ ZOZNAM KARIET TRÁS */
        .catalog-container { flex-grow: 1; overflow-y: auto; padding: 0.9rem; display: flex; flex-direction: column; gap: 0.75rem; }
        .catalog-container::-webkit-scrollbar { width: 6px; }
        .catalog-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        .route-card {
            background: white; border: 1px solid var(--border); border-radius: var(--radius-md);
            padding: 1rem; cursor: pointer; transition: all 0.2s ease; position: relative;
            border-left: 6px solid #cbd5e1; display: flex; flex-direction: column; gap: 0.6rem;
        }
        .route-card.type-bike { border-left-color: var(--accent-bike); }
        .route-card.type-hike { border-left-color: var(--accent-hike); }
        .route-card.type-single { border-left-color: var(--accent-single); }

        .route-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: #94a3b8; }
        .route-card.selected { background: #f0fdf4; border-color: var(--accent-bike); box-shadow: var(--shadow-md); }

        .card-header-line { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; }
        .card-title { font-weight: 800; font-size: 0.93rem; color: var(--primary); line-height: 1.35; }

        .badge-container { display: flex; gap: 0.35rem; flex-wrap: wrap; }
        .badge {
            font-size: 0.65rem; font-weight: 800; padding: 0.2rem 0.5rem; border-radius: 6px;
            text-transform: uppercase; color: white; white-space: nowrap;
        }
        .badge.bike { background: var(--accent-bike); }
        .badge.hike { background: var(--accent-hike); }
        .badge.single { background: var(--accent-single); }
        
        .badge-diff { background: #e2e8f0; color: #334155; }
        .badge-diff.easy { background: #dcfce7; color: #15803d; }
        .badge-diff.medium { background: #fef3c7; color: #b45309; }
        .badge-diff.hard { background: #fee2e2; color: #b91c1c; }

        .card-grid-info {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.4rem;
            background: #f8fafc; padding: 0.55rem; border-radius: 8px;
            font-size: 0.76rem; color: var(--text-muted); font-weight: 600; border: 1px solid #f1f5f9;
        }
        .card-grid-info div { display: flex; align-items: center; gap: 0.35rem; }
        .card-grid-info i { color: var(--primary); font-size: 0.85rem; }

        .card-action-bar { display: flex; justify-content: flex-end; }
        .btn-show-map {
            background: transparent; border: 1px solid var(--border); padding: 0.3rem 0.65rem;
            border-radius: 6px; font-size: 0.72rem; font-weight: 700; color: var(--text-muted);
            cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 0.3rem;
        }
        .route-card:hover .btn-show-map { background: var(--primary); color: white; border-color: var(--primary); }

        /* MAP AREA */
        .map-view {
            background: var(--card-bg); border-radius: var(--radius-lg);
            border: 1px solid var(--border); box-shadow: var(--shadow-sm);
            overflow: hidden; position: relative; display: flex; flex-direction: column;
        }

        #map { width: 100%; height: 100%; z-index: 1; }

        /* CUSTOM POI MARKERS (GOOGLE MAPS STYLE) */
        .poi-pin {
            width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 13px; box-shadow: 0 3px 8px rgba(0,0,0,0.3);
            border: 2px solid white; transition: transform 0.2s;
        }
        .poi-pin:hover { transform: scale(1.25); z-index: 999; }
        
        .poi-peak { background: #ef4444; }        /* Červená - Vrcholy */
        .poi-viewpoint { background: #8b5cf6; }   /* Fialová - Vyhliadky */
        .poi-spring { background: #06b6d4; }      /* Azúrová - Voda/Pramene */
        .poi-shelter { background: #10b981; }     /* Zelená - Prístrešky */
        .poi-castle { background: #d97706; }      /* Jantárová - Hrady/Pamiatky */
        .poi-parking { background: #2563eb; }     /* Modrá - Parkoviská */
        .poi-repair { background: #475569; }      /* Sivá - Cykloservis */

        /* POPUP STYLING */
        .leaflet-popup-content-wrapper { border-radius: 12px; padding: 2px; box-shadow: var(--shadow-md); }
        .popup-box { padding: 8px; font-family: 'Plus Jakarta Sans', sans-serif; }
        .popup-box h4 { font-weight: 800; font-size: 0.98rem; color: var(--primary); margin-bottom: 4px; }
        .popup-info { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px; line-height: 1.4; }

        /* MOBILE TABS */
        .mobile-tabs { display: none; background: white; border-top: 1px solid var(--border); }
        .mobile-tab-btn {
            flex: 1; padding: 0.8rem; border: none; background: transparent; font-weight: 700;
            font-size: 0.85rem; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.4rem;
        }
        .mobile-tab-btn.active { color: var(--primary); border-bottom: 3px solid var(--primary); }

        @media (max-width: 1024px) {
            .app-layout { grid-template-columns: 1fr; height: auto; }
            .sidebar { height: 500px; display: none; }
            .sidebar.active-view { display: flex; }
            .map-view { height: 65vh; min-height: 450px; display: none; }
            .map-view.active-view { display: flex; }
            .mobile-tabs { display: flex; position: sticky; bottom: 0; z-index: 1000; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="brand-box">
                <div class="brand-icon"><i class="fa-solid fa-map-location-dot"></i></div>
                <div class="brand-text">
                    <h1 data-i18n="app_title">Bardejov PRO Geoportál</h1>
                    <p data-i18n="app_subtitle">Kompletná sieť cyklotrás, turistiky, satelitných snímok a bodov záujmu</p>
                </div>
            </div>

            <div class="top-controls">
                <div class="stats-ticker">
                    <div class="stat-item">
                        <span class="val" id="statCount">0</span>
                        <span class="lbl" data-i18n="stat_routes">Trás</span>
                    </div>
                    <div class="stat-item">
                        <span class="val" id="statKm">0 km</span>
                        <span class="lbl" data-i18n="stat_distance">Spolu km</span>
                    </div>
                    <div class="stat-item">
                        <span class="val" id="statPoi">0</span>
                        <span class="lbl" data-i18n="stat_poi">Miest (POI)</span>
                    </div>
                </div>

                <div class="lang-switcher">
                    <button class="lang-btn active" onclick="switchLanguage('sk')">SK</button>
                    <button class="lang-btn" onclick="switchLanguage('en')">EN</button>
                    <button class="lang-btn" onclick="switchLanguage('pl')">PL</button>
                    <button class="lang-btn" onclick="switchLanguage('de')">DE</button>
                </div>
            </div>
        </div>
    </header>

    <div class="app-layout">
        
        <!-- SIDEBAR KATALÓG TRÁS -->
        <aside class="sidebar active-view" id="sidebarView">
            <div class="sidebar-header">
                <div id="statusBadge" class="status-badge loading">
                    <i class="fa-solid fa-spinner fa-spin"></i> <span data-i18n="status_loading">Načítavam GIS geodáta...</span>
                </div>

                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" oninput="filterAndRender()" data-i18n-ph="search_placeholder" placeholder="Hľadať trasu, povrch, miesto...">
                </div>

                <div class="control-row">
                    <select id="sortSelect" class="sort-select" onchange="filterAndRender()">
                        <option value="len_desc" data-i18n="sort_len_desc">Dĺžka: najdlhšie prvé</option>
                        <option value="len_asc" data-i18n="sort_len_asc">Dĺžka: najkratšie prvé</option>
                        <option value="name_asc" data-i18n="sort_name_asc">Názov: A – Z</option>
                    </select>
                </div>

                <div class="filter-pills">
                    <button class="pill-btn active" onclick="setCategory('all', this)" data-i18n="filter_all">Všetky</button>
                    <button class="pill-btn" onclick="setCategory('bike', this)" data-i18n="filter_bike">Cyklo</button>
                    <button class="pill-btn" onclick="setCategory('hike', this)" data-i18n="filter_hike">Turistika</button>
                    <button class="pill-btn" onclick="setCategory('single', this)" data-i18n="filter_single">MTB</button>
                </div>
            </div>

            <div class="catalog-container" id="catalogList"></div>
        </aside>

        <!-- MAPA -->
        <main class="map-view active-view" id="mapView">
            <div id="map"></div>
        </main>

    </div>

    <!-- PREPÍNAČ PRE MOBILNÉ ZARIADENIA -->
    <div class="mobile-tabs">
        <button class="mobile-tab-btn active" onclick="switchMobileTab('mapView', this)">
            <i class="fa-solid fa-map"></i> <span data-i18n="tab_map">Mapa</span>
        </button>
        <button class="mobile-tab-btn" onclick="switchMobileTab('sidebarView', this)">
            <i class="fa-solid fa-list"></i> <span data-i18n="tab_list">Katalóg trás</span>
        </button>
    </div>

                diff_hard: "Schwer",
                btn_focus: "Auf Karte zeigen",
                no_results: "Keine Ergebnisse gefunden.",
                poi_peaks: "⛰️ Berggipfel (Beschriftung)",
                poi_viewpoints: "👁️ Aussichtspunkte",
                poi_springs: "💧 Wasserquellen",
                poi_shelters: "🏕️ Schutzhütten",
                poi_castles: "🏰 Burgen & Denkmäler",
                poi_parking: "🅿️ Parkplätze",
                poi_repair: "🔧 Fahrrad-Service",
                layer_mapycz: "🥾 Mapy.cz Outdoor + Namen",
                layer_cyclosm: "🚴 CyclOSM Radkarte + Namen",
                layer_google_hyb: "🛰️ Google Satellit + Namen (Hybrid)",
                layer_esri_sat: "🛰️ Esri Satellit + Ortsetiketten",
                layer_carto_light: "🗺️ CartoDB Hell mit Namen",
                layer_osm: "🗺️ OpenStreetMap Standard"
            }
        };

        let currentLang = 'sk';
        function t(key, vars = {}) {
            let str = i18n[currentLang][key] || key;
            for (let k in vars) { str = str.replace(`{${k}}`, vars[k]); }
            return str;
        }

        function switchLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const k = el.getAttribute('data-i18n');
                if (i18n[lang][k]) el.innerText = i18n[lang][k];
            });

            document.querySelectorAll('[data-i18n-ph]').forEach(el => {
                const k = el.getAttribute('data-i18n-ph');
                if (i18n[lang][k]) el.placeholder = i18n[lang][k];
            });

            updateLayerControls();
            filterAndRender();
        }

        // --- 2. MAP INITIALIZATION & TILE LAYERS WITH LABELS ---
        const map = L.map('map', { zoomControl: false }).setView([49.29356, 21.25091], 12);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Vrstva s čitateľnými nápismi ulíc a obcí pre satelit
        const cartoLabelsOverlay = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png', {
            subdomains: 'abcd', maxZoom: 20, zIndex: 1000
        });

        const esriSatTile = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19, attribution: '&copy; Esri World Imagery'
        });

        // Kombinovaná Esri Satelit + Nápisy
        const esriSatWithLabels = L.layerGroup([esriSatTile, cartoLabelsOverlay]);

        const baseLayers = {
            mapycz: L.tileLayer('https://m{s}.mapserver.mapy.cz/turist-m/{z}-{x}-{y}', { subdomains: '1234', maxZoom: 19, attribution: '&copy; Mapy.cz' }),
            cyclosm: L.tileLayer('https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png', { maxZoom: 20, attribution: '&copy; CyclOSM' }),
            googleHyb: L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { maxZoom: 20, attribution: '&copy; Google' }),
            esriSat: esriSatWithLabels,
            cartoLight: L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 20, attribution: '&copy; CARTO' }),
            osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' })
        };

        baseLayers.mapycz.addTo(map);

        // POI Overlay Groups
        const poiGroups = {
            peaks: L.layerGroup().addTo(map),
            viewpoints: L.layerGroup().addTo(map),
            springs: L.layerGroup().addTo(map),
            shelters: L.layerGroup().addTo(map),
            castles: L.layerGroup().addTo(map),
            parking: L.layerGroup().addTo(map),
            repair: L.layerGroup().addTo(map)
        };

        let mapLayerControl = L.control.layers({}, {}, { position: 'topright' }).addTo(map);

        function updateLayerControls() {
            mapLayerControl.remove();
            mapLayerControl = L.control.layers({
                [t('layer_mapycz')]: baseLayers.mapycz,
                [t('layer_cyclosm')]: baseLayers.cyclosm,
                [t('layer_google_hyb')]: baseLayers.googleHyb,
                [t('layer_esri_sat')]: baseLayers.esriSat,
                [t('layer_carto_light')]: baseLayers.cartoLight,
                [t('layer_osm')]: baseLayers.osm
            }, {
                [t('poi_peaks')]: poiGroups.peaks,
                [t('poi_viewpoints')]: poiGroups.viewpoints,
                [t('poi_springs')]: poiGroups.springs,
                [t('poi_shelters')]: poiGroups.shelters,
                [t('poi_castles')]: poiGroups.castles,
                [t('poi_parking')]: poiGroups.parking,
                [t('poi_repair')]: poiGroups.repair
            }, { position: 'topright' }).addTo(map);
        }

        updateLayerControls();

        // --- 3. OVERPASS GIS FETCHING ---
        let routesData = [];
        let poiDataCount = 0;
        let activeCategory = 'all';
        let polylineLayerGroup = L.featureGroup().addTo(map);

        // Mapovanie normálnych stálych farieb pre trasy
        const categoryColors = {
            bike: '#10b981',   // Zelená
            hike: '#2563eb',   // Modrá
            single: '#f59e0b'  // Oranžová
        };

        async function fetchAllGeospatialData() {
            updateStatus('loading');
            const bbox = "49.12,21.00,49.48,21.50";

            const query = `
                [out:json][timeout:60];
                (
                  relation["route"~"bicycle|hiking|foot|mtb"](${bbox});
                  way["highway"="cycleway"](${bbox});
                  
                  node["natural"="peak"](${bbox});
                  node["tourism"="viewpoint"](${bbox});
                  node["natural"="spring"](${bbox});
                  node["amenity"="drinking_water"](${bbox});
                  node["amenity"="shelter"](${bbox});
                  node["tourism"="alpine_hut"](${bbox});
                  node["historic"~"castle|ruins"](${bbox});
                  node["amenity"="parking"](${bbox});
                  node["amenity"="bicycle_repair_station"](${bbox});
                );
                out body geom;
            `;

            try {
                const res = await fetch("https://overpass-api.de/api/interpreter", {
                    method: "POST", body: "data=" + encodeURIComponent(query)
                });
                if (!res.ok) throw new Error("API Timeout");
                const json = await res.json();

                processElements(json.elements);
                updateStatus('success');
                filterAndRender();

            } catch (err) {
                console.warn("API nedostupné, načítavam lokálnu databázu", err);
                loadBackupData();
                updateStatus('error');
            }
        }

        function processElements(elements) {
            routesData = [];
            poiDataCount = 0;
            let routeId = 1;

            elements.forEach(el => {
                const tags = el.tags || {};

                // A. SPRACOVANIE TRÁS
                if (el.type === 'way' || el.type === 'relation') {
                    let cat = 'hike';
                    if (tags.route === 'bicycle' || tags.highway === 'cycleway' || tags.bicycle === 'designated') cat = 'bike';
                    else if (tags['mtb:scale'] || tags.route === 'mtb') cat = 'single';

                    let coords = [];
                    if (el.type === 'relation' && el.members) {
                        el.members.forEach(m => {
                            if (m.type === 'way' && m.geometry) {
                                coords.push(m.geometry.map(pt => [pt.lat, pt.lon]));
                            }
                        });
                    } else if (el.type === 'way' && el.geometry) {
                        coords.push(el.geometry.map(pt => [pt.lat, pt.lon]));
                    }

                    if (coords.length > 0) {
                        let totalM = 0;
                        coords.forEach(seg => {
                            for(let i=0; i<seg.length-1; i++) {
                                totalM += map.distance(seg[i], seg[i+1]);
                            }
                        });

                        const km = (totalM / 1000).toFixed(1);
                        if (parseFloat(km) > 0.3) {
                            let diff = 'easy';
                            if (parseFloat(km) > 12 || cat === 'single') diff = 'hard';
                            else if (parseFloat(km) > 6) diff = 'medium';

                            routesData.push({
                                id: `r-${el.id || routeId++}`,
                                name: tags.name || tags.ref || `${t('type_' + cat)} #${routeId++}`,
                                category: cat,
                                lengthKm: km,
                                difficulty: diff,
                                surface: tags.surface || (cat === 'bike' ? 'asphalt' : 'unpaved'),
                                coords: coords
                            });
                        }
                    }
                }

                // B. SPRACOVANIE POI MIEST
                else if (el.type === 'node' && el.lat && el.lon) {
                    let poiType = null;
                    let iconClass = 'fa-location-dot';
                    let pinClass = 'poi-peak';

                    if (tags.natural === 'peak') {
                        poiType = 'peaks'; iconClass = 'fa-mountain'; pinClass = 'poi-peak';
                    } else if (tags.tourism === 'viewpoint') {
                        poiType = 'viewpoints'; iconClass = 'fa-eye'; pinClass = 'poi-viewpoint';
                    } else if (tags.natural === 'spring' || tags.amenity === 'drinking_water') {
                        poiType = 'springs'; iconClass = 'fa-droplet'; pinClass = 'poi-spring';
                    } else if (tags.amenity === 'shelter' || tags.tourism === 'alpine_hut') {
                        poiType = 'shelters'; iconClass = 'fa-campground'; pinClass = 'poi-shelter';
                    } else if (tags.historic || tags.tourism === 'attraction') {
                        poiType = 'castles'; iconClass = 'fa-chess-rook'; pinClass = 'poi-castle';
                    } else if (tags.amenity === 'parking') {
                        poiType = 'parking'; iconClass = 'fa-square-p'; pinClass = 'poi-parking';
                    } else if (tags.amenity === 'bicycle_repair_station') {
                        poiType = 'repair'; iconClass = 'fa-wrench'; pinClass = 'poi-repair';
                    }

                    if (poiType && poiGroups[poiType]) {
                        poiDataCount++;
                        const name = tags.name || tags.description || 'Miesto bez názvu';
                        const ele = tags.ele ? `<br><b>Nadmorská výška:</b> ${tags.ele} m.n.m.` : '';

                        const icon = L.divIcon({
                            className: 'custom-poi-wrapper',
                            html: `<div class="poi-pin ${pinClass}"><i class="fa-solid ${iconClass}"></i></div>`,
                            iconSize: [32, 32], iconAnchor: [16, 16]
                        });

                        const marker = L.marker([el.lat, el.lon], { icon: icon });
                        marker.bindPopup(`
                            <div class="popup-box">
                                <h4>${name}</h4>
                                <div class="popup-info">
                                    <b>Kategória:</b> ${t('poi_' + poiType)}${ele}
                                </div>
                            </div>
                        `);
                        poiGroups[poiType].addLayer(marker);
                    }
                }
            });
        }

        // --- 4. RENDER & FILTER ENGINE ---
        function filterAndRender() {
            polylineLayerGroup.clearLayers();
            const catalog = document.getElementById('catalogList');
            catalog.innerHTML = '';

            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const sortMode = document.getElementById('sortSelect').value;

            // Filtrovanie
            let filtered = routesData.filter(r => {
                const matchCat = activeCategory === 'all' || r.category === activeCategory;
                const matchSearch = r.name.toLowerCase().includes(searchTerm) || r.surface.toLowerCase().includes(searchTerm);
                return matchCat && matchSearch;
            });

            // Zoraďovanie
            if (sortMode === 'len_desc') filtered.sort((a,b) => b.lengthKm - a.lengthKm);
            else if (sortMode === 'len_asc') filtered.sort((a,b) => a.lengthKm - b.lengthKm);
            else if (sortMode === 'name_asc') filtered.sort((a,b) => a.name.localeCompare(b.name));

            let totalKm = 0;

            filtered.forEach(route => {
                totalKm += parseFloat(route.lengthKm);

                // Normálna stála farba pre trasu podľa kategórie
                const normalColor = categoryColors[route.category] || '#2563eb';

                const polyline = L.polyline(route.coords, {
                    color: normalColor,
                    weight: 4.5,
                    opacity: 0.85,
                    lineCap: 'round',
                    lineJoin: 'round'
                });

                // Pripojenie metaúdajov priamo k objektu polyline
                polyline.routeId = route.id;
                polyline.normalColor = normalColor;

                polyline.bindPopup(`
                    <div class="popup-box">
                        <h4>${route.name}</h4>
                        <div class="popup-info">
                            <b>Dĺžka úseku:</b> ${route.lengthKm} km<br>
                            <b>Náročnosť:</b> ${t('diff_' + route.difficulty)}<br>
                            <b>Povrch:</b> ${route.surface}<br>
                            <b>Typ:</b> ${t('type_' + route.category)}
                        </div>
                    </div>
                `);

                polyline.on('click', () => highlightSingleRoute(route.id, polyline));
                polylineLayerGroup.addLayer(polyline);

                // Prehľadná karta v katalógu
                const card = document.createElement('div');
                card.className = `route-card type-${route.category}`;
                card.id = `card-${route.id}`;
                card.innerHTML = `
                    <div class="card-header-line">
                        <span class="card-title">${route.name}</span>
                        <div class="badge-container">
                            <span class="badge ${route.category}">${t('type_' + route.category)}</span>
                            <span class="badge badge-diff ${route.difficulty}">${t('diff_' + route.difficulty)}</span>
                        </div>
                    </div>
                    <div class="card-grid-info">
                        <div><i class="fa-solid fa-ruler-horizontal"></i> ${route.lengthKm} km</div>
                        <div><i class="fa-solid fa-road"></i> ${route.surface}</div>
                        <div><i class="fa-solid fa-layer-group"></i> GIS OSM</div>
                    </div>
                    <div class="card-action-bar">
                        <button class="btn-show-map"><i class="fa-solid fa-crosshairs"></i> ${t('btn_focus')}</button>
                    </div>
                `;

                card.onclick = () => {
                    map.fitBounds(polyline.getBounds(), { padding: [50, 50] });
                    polyline.openPopup();
                    highlightSingleRoute(route.id, polyline);

                    if (window.innerWidth <= 1024) {
                        switchMobileTab('mapView', document.querySelectorAll('.mobile-tab-btn')[0]);
                    }
                };

                catalog.appendChild(card);
            });

            document.getElementById('statCount').innerText = filtered.length;
            document.getElementById('statKm').innerText = `${totalKm.toFixed(0)} km`;
            document.getElementById('statPoi').innerText = poiDataCount;

            if (filtered.length === 0) {
                catalog.innerHTML = `<p style="padding:1.5rem; color:var(--text-muted); font-size:0.85rem; text-align:center;">${t('no_results')}</p>`;
            }

            if (polylineLayerGroup.getLayers().length > 0) {
                map.fitBounds(polylineLayerGroup.getBounds());
            }
        }

        // Zvýrazní výhradne IBA kliknutú trasu, ostatným vráti normálnu farbu
        function highlightSingleRoute(selectedId, activePolyline) {
            polylineLayerGroup.eachLayer(layer => {
                // Obnovenie NORMÁLNEJ farby a hrúbky pre všetky neoznačené trasy
                layer.setStyle({
                    color: layer.normalColor,
                    weight: 4.5,
                    opacity: 0.85
                });
            });

            // Výrazné zvýraznenie IBA pre vybranú trasu
            activePolyline.setStyle({
                color: '#dc2626', // Výrazná svietivá červená pre aktívny výber
                weight: 9,
                opacity: 1.0
            });
            activePolyline.bringToFront();

            // Zvýraznenie v katalógu
            document.querySelectorAll('.route-card').forEach(c => c.classList.remove('selected'));
            const card = document.getElementById(`card-${selectedId}`);
            if (card) {
                card.classList.add('selected');
                card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function setCategory(cat, btn) {
            activeCategory = cat;
            document.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filterAndRender();
        }

        function updateStatus(type) {
            const b = document.getElementById('statusBadge');
            if (type === 'loading') {
                b.className = 'status-badge loading';
                b.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ${t('status_loading')}`;
            } else if (type === 'success') {
                b.className = 'status-badge success';
                b.innerHTML = `<i class="fa-solid fa-circle-check"></i> ${t('status_success', { routes: routesData.length, poi: poiDataCount })}`;
            } else {
                b.className = 'status-badge error';
                b.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> ${t('status_error')}`;
            }
        }

        function switchMobileTab(viewId, btn) {
            document.querySelectorAll('.mobile-tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            document.getElementById('sidebarView').classList.remove('active-view');
            document.getElementById('mapView').classList.remove('active-view');
            document.getElementById(viewId).classList.add('active-view');

            if (viewId === 'mapView') map.invalidateSize();
        }

        function loadBackupData() {
            routesData = [
                { id: "b1", name: "Cyklochodník Bardejov – Bardejovské Kúpele", category: "bike", lengthKm: "5.2", difficulty: "easy", surface: "asfalt", coords: [[[49.2917, 21.2727], [49.2965, 21.2750], [49.3031, 21.2801], [49.3105, 21.2825], [49.3180, 21.2780], [49.3245, 21.2720]]] },
                { id: "b2", name: "Cyklotrasa Bardejov – Hervartov (UNESCO)", category: "bike", lengthKm: "10.8", difficulty: "medium", surface: "asfalt", coords: [[[49.2917, 21.2727], [49.2810, 21.2610], [49.2705, 21.2480], [49.2600, 21.2330], [49.2480, 21.2060]]] },
                { id: "b3", name: "Singletrack Cyklostopy Bardejov", category: "single", lengthKm: "4.1", difficulty: "hard", surface: "lesná cesta", coords: [[[49.3250, 21.2720], [49.3275, 21.2680], [49.3301, 21.2650], [49.3315, 21.2690], [49.3280, 21.2730]]] },
                { id: "b4", name: "Výstup na Žobrák a rozhľadňu z Hervartova", category: "hike", lengthKm: "8.5", difficulty: "medium", surface: "chodník", coords: [[[49.2480, 21.2060], [49.2390, 21.1920], [49.2310, 21.1750], [49.2220, 21.1590]]] }
            ];
            poiDataCount = 2;

            const p1 = L.marker([49.3245, 21.2720], { icon: L.divIcon({ className:'c', html:'<div class="poi-pin poi-shelter"><i class="fa-solid fa-campground"></i></div>' }) }).bindPopup("<b>Altánok Bardejovské Kúpele</b>");
            poiGroups.shelters.addLayer(p1);

            const p2 = L.marker([49.2220, 21.1590], { icon: L.divIcon({ className:'c', html:'<div class="poi-pin poi-viewpoint"><i class="fa-solid fa-eye"></i></div>' }) }).bindPopup("<b>Rozhľadňa Žobrák</b>");
            poiGroups.viewpoints.addLayer(p2);

            filterAndRender();
        }

        // Štart aplikácie
        fetchAllGeospatialData();
    </script>
</body>
</html>
