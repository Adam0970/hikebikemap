<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRO Geoportál Bardejov – Cyklo & Turistika</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #1e293b;
            --secondary: #334155;
            --accent-bike: #10b981;  /* Emerald */
            --accent-hike: #3b82f6;  /* Blue */
            --accent-single: #f59e0b; /* Amber */
            --bg-light: #f8fafc;
            --border: #e2e8f0;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body { background-color: var(--bg-light); color: var(--primary); }

        header {
            background: #0f172a;
            color: white;
            padding: 2rem 5%;
            text-align: center;
            border-bottom: 4px solid var(--accent-bike);
        }

        header h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 0.5rem; }
        header p { color: #94a3b8; font-size: 1.1rem; max-width: 800px; margin: 0 auto; }

        .dashboard {
            max-width: 1600px;
            margin: 2rem auto;
            padding: 0 2%;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 1.5rem;
            align-items: start;
        }

        /* SIDEBAR / FILTERS */
        .panel {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            padding: 1.5rem;
            position: sticky;
            top: 2rem;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }

        .panel-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 1.2rem; display: flex; align-items: center; gap: 0.5rem; }
        
        .loading-box {
            background: #f1f5f9;
            padding: 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
            border: 1px solid #cbd5e1;
        }

        .loading-box.success { background: #dcfce7; color: #166534; border-color: #86efac; }
        .loading-box.error { background: #fee2e2; color: #991b1b; border-color: #fca5a5; }

        .filter-group { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.5rem; }
        
        .btn-filter {
            background: white;
            border: 1px solid var(--border);
            padding: 0.8rem 1rem;
            border-radius: 8px;
            text-align: left;
            font-weight: 600;
            color: var(--secondary);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .btn-filter:hover { border-color: var(--primary); background: #f8fafc; }
        .btn-filter.active { background: var(--primary); color: white; border-color: var(--primary); }

        .catalog-scroll {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            padding-right: 5px;
        }
        
        /* Custom Scrollbar */
        .catalog-scroll::-webkit-scrollbar { width: 6px; }
        .catalog-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
        .catalog-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        /* ROUTE CARD */
        .route-card {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
        }
        
        .route-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); border-color: #94a3b8; }
        .route-card.active-card { border: 2px solid var(--accent-hike); box-shadow: var(--shadow-sm); }
        
        .route-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem; }
        .route-name { font-weight: 700; font-size: 0.95rem; line-height: 1.3; }
        
        .badge {
            font-size: 0.7rem; font-weight: 800; padding: 0.2rem 0.5rem; border-radius: 4px; text-transform: uppercase; color: white;
        }
        .badge.bike { background: var(--accent-bike); }
        .badge.hike { background: var(--accent-hike); }
        .badge.single { background: var(--accent-single); }
        
        .route-meta { font-size: 0.8rem; color: #64748b; display: flex; gap: 1rem; margin-top: 0.5rem; }
        .route-meta span { display: flex; align-items: center; gap: 0.3rem; }

        /* MAP AREA */
        .map-container {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 90vh; /* Zaplní 90% výšky okna */
        }

        #map { width: 100%; flex-grow: 1; z-index: 1; }

        /* Vzhľad Popup-u priamo v mape */
        .leaflet-popup-content-wrapper { border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .leaflet-popup-content { margin: 15px; font-family: 'Inter'; }
        .popup-title { font-weight: 800; font-size: 1.1rem; color: #0f172a; margin-bottom: 5px; }
        .popup-data { font-size: 0.85rem; color: #475569; margin-bottom: 10px; }

        @media (max-width: 1024px) {
            .dashboard { grid-template-columns: 1fr; }
            .panel { max-height: 500px; position: static; }
            .map-container { height: 70vh; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Geoportál Okresu Bardejov PRO</h1>
        <p>Ultra-presné trasovanie generované priamo z geometrických uzlov OpenStreetMap (bez "náhodných čiar"). Mapové podklady Mapy.cz, CyclOSM a Kataster.</p>
    </header>

    <div class="dashboard">
        
        <!-- Bočný Panel s Katalógom a Filtrom -->
        <aside class="panel">
            <h2 class="panel-title"><i class="fa-solid fa-server"></i> Stav pripojenia</h2>
            <div id="loadingStatus" class="loading-box">
                <i class="fa-solid fa-circle-notch fa-spin"></i> Sťahujem presnú geometriu...
            </div>

            <h2 class="panel-title"><i class="fa-solid fa-filter"></i> Vrstvy trás</h2>
            <div class="filter-group">
                <button class="btn-filter active" onclick="applyFilter('all', this)">
                    <span>Zobraziť všetky</span> <i class="fa-solid fa-layer-group"></i>
                </button>
                <button class="btn-filter" onclick="applyFilter('bike', this)">
                    <span>Cyklotrasy & Cesty</span> <i class="fa-solid fa-person-biking" style="color: var(--accent-bike)"></i>
                </button>
                <button class="btn-filter" onclick="applyFilter('hike', this)">
                    <span>Turistické chodníky</span> <i class="fa-solid fa-person-hiking" style="color: var(--accent-hike)"></i>
                </button>
                <button class="btn-filter" onclick="applyFilter('single', this)">
                    <span>MTB & Singletracky</span> <i class="fa-solid fa-mountain" style="color: var(--accent-single)"></i>
                </button>
            </div>

            <h2 class="panel-title"><i class="fa-solid fa-list"></i> Katalóg trás (<span id="routeCount">0</span>)</h2>
            <div id="catalog" class="catalog-scroll">
                <!-- Karty sa generujú dynamicky cez JS -->
            </div>
        </aside>

        <!-- Hlavná Mapa -->
        <main class="map-container">
            <div id="map"></div>
        </main>

    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --- 1. INICIALIZÁCIA MAPY ---
        const map = L.map('map').setView([49.29356, 21.25091], 12);

        // Mapové podklady najvyššej kvality
        const mapyCzOutdoor = L.tileLayer('https://m{s}.mapserver.mapy.cz/turist-m/{z}-{x}-{y}', {
            subdomains: '1234', maxZoom: 19, attribution: '&copy; Mapy.cz / Seznam.cz'
        });

        const cykloOsm = L.tileLayer('https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png', {
            maxZoom: 20, attribution: '&copy; CyclOSM & OSM'
        });

        const googleSat = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            maxZoom: 20, attribution: '&copy; Google Maps'
        });

        const katasterTopo = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19, attribution: '&copy; ZBGIS / Esri Topo'
        });

        // Predvolená vrstva Mapy.cz (najlepšie pre Slovensko a turistiku)
        mapyCzOutdoor.addTo(map);

        L.control.layers({
            "🥾 Mapy.cz Turistická": mapyCzOutdoor,
            "🚴 OSM Cyklomapa (CyclOSM)": cykloOsm,
            "🛰️ Google Satelit": googleSat,
            "📐 Kataster / Topo": katasterTopo
        }, null, { position: 'topright' }).addTo(map);

        // --- 2. GLOBÁLNE PREMENNÉ ---
        let allRoutes = [];
        let mapLayerGroup = L.featureGroup().addTo(map); // Umožňuje centovať mapu na všetky prvky
        let activeFilterType = 'all';
        let highlightedLayer = null;

        // --- 3. SŤAHOVANIE DÁT Z OVERPASS API (out geom;) ---
        // 'out geom' zaručuje, že dostaneme presné pole súradníc každej cesty, eliminuje random čiary!
        async function fetchProfessionalGeodata() {
            const statusBox = document.getElementById('loadingStatus');
            const bbox = "49.15,21.05,49.45,21.45"; // Región Bardejova

            const query = `
                [out:json][timeout:50];
                (
                  relation["route"="bicycle"](${bbox});
                  relation["route"="hiking"](${bbox});
                  relation["route"="foot"](${bbox});
                  relation["route"="mtb"](${bbox});
                  way["highway"="cycleway"](${bbox});
                  way["highway"="path"]["bicycle"="designated"](${bbox});
                  way["mtb:scale"](${bbox});
                );
                out body geom; 
            `; // KÚZLO JE V "out body geom;". To vráti presný tvar ciest, nielen ID bodov.

            try {
                const response = await fetch("https://overpass-api.de/api/interpreter", {
                    method: "POST", body: "data=" + encodeURIComponent(query)
                });
                
                if (!response.ok) throw new Error("API preťažené, skúste o chvíľu.");
                const data = await response.json();
                
                processOSMData(data.elements);
                
                statusBox.className = 'loading-box success';
                statusBox.innerHTML = `<i class="fa-solid fa-check-circle"></i> Úspešne načítaných ${allRoutes.length} presných trás`;
                
                renderData();

            } catch (error) {
                console.error(error);
                statusBox.className = 'loading-box error';
                statusBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> Nastala chyba pripojenia.`;
            }
        }

        // --- 4. SPRACOVANIE GEOMETRIE DO MULTI-LÍNIÍ ---
        function processOSMData(elements) {
            let routeCounter = 1;

            elements.forEach(el => {
                let tags = el.tags || {};
                
                // Zistenie kategórie trasy
                let category = 'hike';
                if (tags.route === 'bicycle' || tags.highway === 'cycleway' || tags.bicycle === 'designated') {
                    category = 'bike';
                } else if (tags['mtb:scale'] || tags.route === 'mtb') {
                    category = 'single';
                }

                // Extrakcia presnej geometrie (polia vo vnútri polí)
                let multiCoords = [];
                
                if (el.type === 'relation' && el.members) {
                    el.members.forEach(m => {
                        if (m.type === 'way' && m.geometry) {
                            multiCoords.push(m.geometry.map(pt => [pt.lat, pt.lon]));
                        }
                    });
                } else if (el.type === 'way' && el.geometry) {
                    multiCoords.push(el.geometry.map(pt => [pt.lat, pt.lon]));
                }

                if (multiCoords.length > 0) {
                    // Výpočet dĺžky
                    let lengthMeters = 0;
                    multiCoords.forEach(segment => {
                        for(let i = 0; i < segment.length - 1; i++) {
                            lengthMeters += map.distance(segment[i], segment[i+1]);
                        }
                    });

                    // Ak je trasa dlhšia ako 300 metrov, uložíme ju
                    if (lengthMeters > 300) {
                        let defaultName = category === 'bike' ? 'Cykloúsek' : (category === 'single' ? 'MTB Trail' : 'Turistický chodník');
                        
                        allRoutes.push({
                            id: `gis-${el.id}`,
                            name: tags.name || tags.ref || `${defaultName} #${routeCounter++}`,
                            category: category,
                            lengthKm: (lengthMeters / 1000).toFixed(1),
                            surface: tags.surface || 'Neznámy',
                            coords: multiCoords // Toto je kľúčové! Je to Pole polí (MultiPolyline). Presne lícuje cestu.
                        });
                    }
                }
            });

            // Zoradenie podľa dĺžky (najdlhšie prvé)
            allRoutes.sort((a, b) => b.lengthKm - a.lengthKm);
        }

        // --- 5. VYKRESLENIE DO MAPY A KATALÓGU ---
        function renderData() {
            mapLayerGroup.clearLayers();
            const catalog = document.getElementById('catalog');
            catalog.innerHTML = '';
            let visibleCount = 0;

            allRoutes.forEach(route => {
                if (activeFilterType === 'all' || route.category === activeFilterType) {
                    visibleCount++;

                    // Farby podľa kategórie
                    let routeColor = route.category === 'bike' ? '#10b981' : (route.category === 'single' ? '#f59e0b' : '#3b82f6');
                    
                    // L.polyline spracuje pole polí automaticky ako viacnásobnú lomenú čiaru (MultiPolyline)
                    let polyline = L.polyline(route.coords, {
                        color: routeColor,
                        weight: 5,
                        opacity: 0.8,
                        lineCap: 'round',
                        lineJoin: 'round'
                    });

                    // Interaktivita v mape
                    polyline.bindPopup(`
                        <div class="popup-title">${route.name}</div>
                        <div class="popup-data">
                            <b>Dĺžka:</b> ${route.lengthKm} km<br>
                            <b>Povrch:</b> ${route.surface}<br>
                            <b>Typ:</b> ${route.category.toUpperCase()}
                        </div>
                    `);

                    polyline.on('mouseover', function() { this.setStyle({ weight: 8, opacity: 1 }); });
                    polyline.on('mouseout', function() { 
                        if(highlightedLayer !== this) this.setStyle({ weight: 5, opacity: 0.8 }); 
                    });

                    polyline.on('click', () => { activateCard(route.id, polyline); });

                    mapLayerGroup.addLayer(polyline);

                    // Vytvorenie karty v katalógu
                    const card = document.createElement('div');
                    card.className = `route-card`;
                    card.id = `card-${route.id}`;
                    card.innerHTML = `
                        <div class="route-header">
                            <span class="route-name">${route.name}</span>
                            <span class="badge ${route.category}">${route.category}</span>
                        </div>
                        <div class="route-meta">
                            <span><i class="fa-solid fa-ruler"></i> ${route.lengthKm} km</span>
                            <span><i class="fa-solid fa-road"></i> ${route.surface}</span>
                        </div>
                    `;

                    card.onclick = () => {
                        map.fitBounds(polyline.getBounds(), { padding: [50, 50] });
                        polyline.openPopup();
                        activateCard(route.id, polyline);
                    };

                    catalog.appendChild(card);
                }
            });

            document.getElementById('routeCount').innerText = visibleCount;
            
            // Po prvom načítaní centrovat mapu na všetky nájdené trasy
            if (mapLayerGroup.getLayers().length > 0) {
                map.fitBounds(mapLayerGroup.getBounds());
            }
        }

        // --- 6. POMOCNÉ FUNKCIE (Filtre a Zvýraznenie) ---
        function applyFilter(type, btnElement) {
            activeFilterType = type;
            document.querySelectorAll('.btn-filter').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            renderData();
        }

        function activateCard(routeId, layer) {
            // Reset štýlov mapy
            mapLayerGroup.eachLayer(l => l.setStyle({ weight: 5, opacity: 0.8, color: l.options.color }));
            
            // Zvýraznenie kliknutej čiary
            layer.setStyle({ weight: 8, opacity: 1, color: '#ef4444' }); // Červená pre aktívnu
            highlightedLayer = layer;
            layer.bringToFront();

            // Reset a nastavenie kariet
            document.querySelectorAll('.route-card').forEach(c => c.classList.remove('active-card'));
            const activeCard = document.getElementById(`card-${routeId}`);
            if (activeCard) {
                activeCard.classList.add('active-card');
                activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        // Štart aplikácie
        fetchProfessionalGeodata();
    </script>
</body>
</html>
